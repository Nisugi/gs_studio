# global/lighting.toml — proposed shipped defaults for the time-of-day passes.
# Applied to EVERYTHING in the creature field (backdrop, props, creatures) for
# outdoor scenes. Day has no entry = no change. These are the GLOBAL defaults:
# every scene uses them unless its own [light.<phase>] table overrides a field
# (see scene_light_example.toml). Editable in Settings > Lighting; the player's
# Lighting strength (also there) scales every light on top of these.
#
# intensity : 0 = no change .. 1 = the full look (the player's Lighting
#             strength setting multiplies it)
# key       : main light colour     ambient : shadow-side fill
# fog/haze  : soft wash toward fog  exposure: brightness (1 = unchanged)
# chroma    : saturation scale      night   : night vision (saturation fades,
#                                             warm hues dim first)
# strength  : how strongly the light colours tint
#
# Schedule (game hours; boundaries = core::elanthian_time::PhaseBoundaries):
#   06:00-07:00 night -> dawn   07:00 dawn at its peak   07:00-08:00 dawn -> day
#   08:00-18:00 day             18:00-19:00 day -> dusk  19:00 dusk at its peak
#   19:00-20:00 dusk -> night   20:00-06:00 night

[phase.dawn]
bounce_strength = 0.0   # time-of-day light adds no ground bounce
key = "#f4b9c4"
ambient = "#9c9ed0"
fog = "#eadbe6"
haze = 0.10
strength = 0.5
exposure = 0.85
chroma = 0.9
intensity = 0.8

[phase.dusk]
bounce_strength = 0.0   # time-of-day light adds no ground bounce
key = "#ec9a86"
ambient = "#665fa6"
fog = "#e6c2c0"
haze = 0.06
strength = 0.6
exposure = 0.64
chroma = 0.9
intensity = 0.75

[phase.night]
bounce_strength = 0.0   # time-of-day light adds no ground bounce
key = "#56648c"
ambient = "#2c3550"
strength = 0.9
exposure = 0.3
night = 0.85
intensity = 0.7

# How black the dark is beyond the lamps, 0..1, in a lit scene that does not
# set its own ([light] darkness): outdoors at the darkest of night (half of it
# at dusk and dawn), indoors at every hour -- a room needs a lamp.
[darkness]
outdoor = 0.7
indoor = 0.88

# The moons over outdoor scenes. Liabo, the great moon: a full one rises at
# 18:00, is highest at midnight and sets at 06:00, and each moon runs later as
# it wanes (creature_field::sky). Where the GPU pass draws each is a light from the
# sky with shadows; elsewhere they lift the darkness evenly, by `lift` at a
# full Liabo in a clear sky. strength: 0 = no moonlight .. 1 = as shipped.
# Lornon, the dark moon, is a cloudy grey, crimson by Lornon's Eve;
# lornon_strength is a full Lornon's light as a share of a full Liabo's.
[moon]
color = "#b4c4ec"
strength = 1.0
lift = 0.4
lornon_color = "#aeb0b8"
lornon_blood_color = "#c8322c"
lornon_strength = 0.3
