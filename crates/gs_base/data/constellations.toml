# The constellations of Elanthia's northern sky, from "Constellations of
# the Northern Sky", an official GemStone IV document on the GemStone IV
# wiki, which lists them by season. Each is the constellation of its two
# weeks of the year (`first` .. `last`, [month, day], Lormesta = 1 ..
# Eorgaen = 12, the months ours).
#
# The stars were traced from the document's drawings: x, y from the
# drawing's centre, -1..1, y up; `size` how big the drawing makes one
# (1 = an ordinary star); `color` its colour there. `nebulae`: the glows
# the drawings paint, an ellipse each (`long`, `wide`: half its axes;
# `angle` of the long one, degrees, counter-clockwise from x).

