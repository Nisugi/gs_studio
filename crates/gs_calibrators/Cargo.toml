[package]
name = "gs_calibrators"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The GemStone IV art calibrators as embeddable egui windows: creature sprites, scenery, Hydra's frame templates and injury-doll pictures. They write the sidecar TOML, PNG metadata and template folders game clients read. Ported from VellumFE; gs-studio's."

[lib]
doctest = false

[dependencies]
creature_field = { path = "../creature_field" }
creature_field_egui = { path = "../creature_field_egui" }
# MUST be the same egui the host apps link (VellumFE, gs-studio): contexts
# and textures cross the crate boundary.
egui = { workspace = true }
# The creature calibrator's alpha bounding box (content bbox of a sprite).
# Same version and codec set as VellumFE / creature_field_egui.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# The doll calibrator's save -> anyhow::Result.
anyhow = "1"
# The doll calibrator reads and writes a picture's vellum-meta TOML.
toml = "0.8"
# warn! call sites kept from the originals.
tracing = "0.1"

[dev-dependencies]
# Tests read the committed forms pack from disk (nothing is compiled in).
creature_field = { path = "../creature_field", features = ["test-forms"] }
tempfile = "3"
# examples/calibrators_demo.rs only. Same source, branch and features as the hosts.
eframe = { workspace = true }
