[package]
name = "gs_calibrators"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The GemStone IV art calibrators as embeddable egui windows: creature sprites, scenery, window frames, injury-doll sets and injury-doll anchors. They write the sidecar TOML + PNG metadata game clients read. Ported from VellumFE; shared by VellumFE and gs-studio."

[lib]
doctest = false

[dependencies]
gs_field = { path = "../gs_field" }
gs_field_egui = { path = "../gs_field_egui" }
# MUST be the same egui the host apps link (VellumFE, gs-studio): contexts
# and textures cross the crate boundary.
egui = { git = "https://github.com/Nisugi/egui.git", branch = "numpad-support", package = "egui" }
# The creature calibrator's alpha bounding box (content bbox of a sprite).
# Same version and codec set as VellumFE / gs_field_egui.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# DollEntry::save -> anyhow::Result.
anyhow = "1"
# warn! call sites kept from the originals.
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# examples/calibrators_demo.rs only. Same source, branch and features as the hosts.
eframe = { git = "https://github.com/Nisugi/egui.git", branch = "numpad-support", package = "eframe", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
