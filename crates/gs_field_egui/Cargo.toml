[package]
name = "gs_field_egui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Draws the GemStone IV creature field with egui: the creature-art cache, image decoding, and the stage renderer. Ported from VellumFE; shared by VellumFE and gs-studio."

[lib]
doctest = false

[dependencies]
gs_field = { path = "../gs_field" }
# ADDITION (not in VellumFE): the baked 3D creature puppets the no-art draw
# path prefers over the flat doll.
gs_puppet = { path = "../gs_puppet" }
# MUST be the same egui the host apps link (VellumFE, gs-studio): textures,
# painters and contexts cross the crate boundary.
egui = { git = "https://github.com/Nisugi/egui.git", branch = "numpad-support", package = "egui" }
# Art decoding. Same version and codec set as VellumFE's Cargo.toml.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# warn! on unreadable / undecodable art and skipped overlays.
tracing = "0.1"
# ADDITION (not in VellumFE): creature-field lighting (lit twins).
vellum_light = { path = "../vellum_light" }
# ADDITION (not in VellumFE): the v2 field lighting pass (`field_gpu`),
# drawn through an egui_wgpu paint callback. MUST be the same source and
# branch as egui (the host's renderer owns the callback resources).
egui-wgpu = { git = "https://github.com/Nisugi/egui.git", branch = "numpad-support", package = "egui-wgpu", default-features = false }
bytemuck = "1"

[dev-dependencies]
tempfile = "3"
# examples/stage_demo.rs only. Same source, branch and features as the hosts.
eframe = { git = "https://github.com/Nisugi/egui.git", branch = "numpad-support", package = "eframe", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
