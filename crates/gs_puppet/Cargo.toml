[package]
name = "gs_puppet"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A poseable 3D puppet built from a rig plus a front and a side silhouette (measured cross-sections), drawn with plain 2D shapes."

[lib]
doctest = false

[dependencies]
rig = { path = "../rig" }
rig_bake = { path = "../rig_bake" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Only `paint.rs` touches egui; everything else is egui-free.
egui = { git = "https://github.com/Nisugi/egui.git", rev = "ed8b2649fd4b1c3351e38988b045f1bf33335f38", package = "egui" }

[dev-dependencies]
eframe = { git = "https://github.com/Nisugi/egui.git", rev = "ed8b2649fd4b1c3351e38988b045f1bf33335f38", package = "eframe", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
png = "0.17"
