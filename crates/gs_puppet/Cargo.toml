[package]
name = "gs_puppet"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PROTOTYPE. A poseable 3D capsule puppet built from a rig plus a front and a side silhouette, drawn with plain 2D shapes through a perspective camera."

[lib]
doctest = false

[dependencies]
rig = { path = "../rig" }
rig_bake = { path = "../rig_bake" }
# Only `paint.rs` touches egui; everything else is egui-free.
egui = { git = "https://github.com/Nisugi/egui.git", branch = "numpad-support", package = "egui" }

[dev-dependencies]
eframe = { git = "https://github.com/Nisugi/egui.git", branch = "numpad-support", package = "eframe", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
png = "0.17"
