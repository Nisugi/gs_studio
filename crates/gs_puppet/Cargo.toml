[package]
name = "gs_puppet"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A poseable 3D puppet -- read from its baked file, posed, drawn as shapes, a smooth skin or splats, its injury doll layers built on it. The runtime half; building one is gs_puppet_author."

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Pure Rust zstd decoder (Android-safe, no C): the `.spz` splat clouds.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }

[dev-dependencies]
toml = "0.8"
png = "0.17"

[features]
# `gs_puppet::fixtures`: test inputs for the crates over this one
# (turned on from their dev-dependencies only).
fixtures = []
