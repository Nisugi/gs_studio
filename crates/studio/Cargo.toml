[package]
name = "studio"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "gs_studio: art-authoring app for GemStone IV clients."

[[bin]]
name = "gs-studio"
path = "src/main.rs"

[features]
# Pack an art pool (minus the injury dolls) and the rig data into the
# binary; a fresh gs-studio home is filled from it. See build.rs.
#   cargo build --release -p studio --features bundled-art
bundled-art = []

[dependencies]
rig = { path = "../rig" }
rig_bake = { path = "../rig_bake" }
# Depth guessing for the rig editor's DEPTH pass (`editor/depth.rs`).
gs_puppet = { path = "../gs_puppet" }
gs_puppet_author = { path = "../gs_puppet_author" }
# The creature field: solver, scenes, pool, bestiary (no egui) ...
creature_field = { path = "../creature_field" }
# ... and the renderer + art cache the clients draw with.
creature_field_egui = { path = "../creature_field_egui" }
# The injury doll: its figures, sky, state and view (the Doll window).
injury_doll = { path = "../injury_doll" }
# Asset packs: one installed into a pool (gs_base::packs), one zipped for
# release (`--pack`).
gs_base = { path = "../gs_base" }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Texture sheets and paint-over templates (editor::texture).
png = "0.17"
# marks.json and jobs.json for the texture generator (editor::texture).
serde_json = "1"
# Scene lighting types for the Stage editor.
vellum_light = { path = "../vellum_light" }
# The art calibrators, hosted as tabs through `ui_contents`.
gs_calibrators = { path = "../gs_calibrators" }
# gs-studio's own data home (`data_home.rs`): the platform config directory,
# so this standalone app does not squat in VellumFE's. Same crate and major
# gs_base uses for `~`.
dirs = "5"
# settings.toml (remembered folders).
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# The pose editor rewrites pose files in place, comments kept (editor::pose_edit).
toml_edit = "0.22"
egui = { workspace = true }
eframe = { workspace = true }

[dev-dependencies]
# Tests read the committed forms pack from disk (nothing is compiled in).
creature_field = { path = "../creature_field", features = ["test-forms"] }
tempfile = "3"
