[package]
name = "studio"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "gs_studio: art-authoring app for GemStone IV clients."

[[bin]]
name = "gs-studio"
path = "src/main.rs"

[dependencies]
rig = { path = "../rig" }
rig_bake = { path = "../rig_bake" }
# The creature field: solver, scenes, pool, bestiary (no egui) ...
gs_field = { path = "../gs_field" }
# ... and the renderer + art cache the clients draw with.
gs_field_egui = { path = "../gs_field_egui" }
egui = { git = "https://github.com/Nisugi/egui.git", branch = "numpad-support", package = "egui" }
eframe = { git = "https://github.com/Nisugi/egui.git", branch = "numpad-support", package = "eframe", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }

[dev-dependencies]
tempfile = "3"
