# Clothing kit: the garment pieces a creature can wear.
#
# gs_puppet::outfit reads this. Each piece is built from the wearer's own
# measured body, so one kit fits every family that has the parts a piece
# hangs from. What a creature wears is outfits.toml (one table per creature,
# with its own tweaks of these numbers).
#
# shape: how the piece is built --
#   hem       waist to hem, as wide as the hips and legs it covers, split at
#             the knees; aimed at the knees and ankles every pose, so it
#             drapes over the lap sitting and follows the legs lying.
#             Covers (and hides) the thighs when it reaches the knees, the
#             shins when it reaches the ankles. Robes, tunics, skirts, kilts.
#   hood      the head's own shell, bigger, set back so the face shows
#   pauldron  a dome over the top of each upper arm
#   cloak     from the shoulders down behind the body, wrapping the sides;
#             hangs straight down, or along the body when it lies
#
# length: hem -- how far from the waist toward the floor (1 = the floor);
#         cloak -- the same, from the shoulders
# flare:  how much wider than what it covers it is at the hem
# size:   hood, pauldron -- a multiple of the head / the shoulder

[robe]
shape = "hem"
length = 1.0
flare = 1.45

[robe_short]
shape = "hem"
length = 0.55
flare = 1.2

[skirt]
shape = "hem"
length = 0.3
flare = 1.35

[hood]
shape = "hood"

[pauldrons]
shape = "pauldron"

[cloak]
shape = "cloak"
length = 0.8
flare = 1.25
