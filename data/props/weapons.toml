# Held props: what a puppet can hold, and how each thing is shaped.
#
# gs_puppet::prop reads this, compiled in (engine data: never published).
# Everything above the "weapons" marker is hand-written. The [weapon.*]
# tables below it are generated by tools/import_armaments.py from Lich's
# armaments data (names, categories); the shape, length and hands each base
# gets are set in that script, so re-run it rather than editing them here.
#
# A SHAPE is a list of parts laid along the prop's axis, from the grip
# (0) toward its tip (1), in units of the weapon's length:
#
#   at       = [from, to]    where along the axis (negative: behind the grip)
#   w        = half-width across the flat, a number or [at from, at to]
#   d        = half-thickness (default: w, round)
#   off      = shift across the flat (+ = the edge side), a number or a pair
#   round    = true: a ball (pommel, mace head), bulging between from and to
#   material = a [material] name
#
# grip: how the prop sits in a hanging hand --
#   forward  points ahead of the creature, a little down (swords, axes)
#   up       stands upright through the fist (staves, polearms, bows)
#   down     hangs from the fist (whips, flails)
#   shield   a disc on the forearm, facing out

[material]
steel = [182, 188, 198]
iron = [118, 122, 130]
bronze = [176, 128, 72]
gold = [214, 176, 84]
wood = [128, 90, 54]
dark_wood = [92, 62, 38]
leather = [96, 64, 42]
bone = [222, 212, 188]
string = [214, 206, 180]
crystal = [150, 196, 226]

