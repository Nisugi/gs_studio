parent = "thorax"
joints = ["leg4_base_r", "leg4_knee_r", "leg4_tip_r"]

[[bones]]
name = "leg4_l"
part = "leftLeg"
parent = "thorax"
joints = ["leg4_base_l", "leg4_knee_l", "leg4_tip_l"]

[[bones]]
