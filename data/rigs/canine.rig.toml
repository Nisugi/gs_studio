version = 2
family = "canine"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [0.0, 1.66]
chest_front = [1.7, 2.0]
croup = [-1.35, 2.45]
elbow_l = [1.3, 1.4]
elbow_r = [1.0, 1.4]
eye_r = [2.8, 2.86]
forepaw_l = [1.5, 0.08]
forepaw_r = [1.15, 0.08]
groin = [-0.9, 1.8]
hindpaw_l = [-1.95, 0.08]
hindpaw_r = [-0.8, 0.08]
hip_l = [-1.5, 2.1]
hip_r = [-1.2, 2.1]
hock_l = [-2.05, 0.95]
hock_r = [-1.17, 0.75]
mid_back = [0.0, 2.52]
nose = [3.2, 2.58]
poll = [2.45, 3.08]
shoulder_l = [1.35, 2.0]
shoulder_r = [1.2, 2.0]
sternum = [1.05, 1.62]
stifle_l = [-1.35, 1.5]
stifle_r = [-0.8, 1.4]
tail_base = [-1.95, 2.12]
tail_tip = [-3.2, 1.36]
withers = [1.15, 2.62]
wrist_l = [1.3, 0.45]
wrist_r = [0.97, 0.45]

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
