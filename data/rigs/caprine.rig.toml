version = 2
family = "caprine"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l", "horn_base_r", "horn_mid_r", "horn_bend_r", "horn_tip_r", "horn_base_l", "horn_mid_l", "horn_bend_l", "horn_tip_l", "ear_base_r", "ear_tip_r", "ear_base_l", "ear_tip_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.5344, 1.6137]
chest_front = [0.9444, 1.9133]
croup = [-2.1568, 2.7621]
ear_base_l = [1.2539, 3.6109]
ear_base_r = [1.2539, 3.6109]
ear_tip_l = [-0.0403, 3.7407]
ear_tip_r = [-0.0403, 3.7407]
elbow_l = [0.6852, 1.3641]
elbow_r = [0.3015, 1.414]
eye_r = [1.7253, 3.3113]
forepaw_l = [0.7407, 0.0859]
forepaw_r = [0.3949, 0.0659]
groin = [-0.9737, 1.7635]
hindpaw_l = [-1.646, 0.0459]
hindpaw_r = [-1.1182, 0.0859]
hip_l = [-1.3389, 2.2628]
hip_r = [-1.1039, 2.2628]
hock_l = [-1.7754, 0.8648]
hock_r = [-1.3373, 0.9646]
horn_base_l = [0.8595, 3.7108]
horn_base_r = [0.8595, 3.7108]
horn_bend_l = [0.8631, 4.1601]
horn_bend_r = [0.8631, 4.1601]
horn_mid_l = [0.3945, 3.9604]
horn_mid_r = [0.3945, 3.9604]
horn_tip_l = [0.996, 4.0802]
horn_tip_r = [0.996, 4.0802]
mid_back = [-0.3177, 2.7621]
nose = [2.0858, 2.862]
poll = [1.3106, 3.4611]
shoulder_l = [0.6054, 2.2628]
shoulder_r = [0.3917, 2.2628]
sternum = [0.4011, 1.6137]
stifle_l = [-0.662, 1.4639]
stifle_r = [-0.7157, 1.5139]
tail_base = [-1.9188, 2.5124]
tail_tip = [-0.5405, 2.1629]
withers = [0.793, 2.837]
wrist_l = [0.5812, 0.3655]
wrist_r = [0.2666, 0.4154]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# Horns and ears are extra head bones; their spread is read off caprine-front
# (horns rise from the crown and curl out to +-1.0, ears stick out to +-0.7).
# Legs: forelegs +-0.20 (inner columns), hind legs +-0.38 (outer columns).
# [radius_depth_ft]: slim legs where they merge into the body in the front
# view, and an underline no wider than the belly (the leg outline slivers
# otherwise merge into it).
[depth]
ear_base_l = 0.4
ear_base_r = -0.4
ear_tip_l = 0.68
ear_tip_r = -0.68
elbow_l = 0.2
elbow_r = -0.2
forepaw_l = 0.2
forepaw_r = -0.2
hindpaw_l = 0.38
hindpaw_r = -0.38
hip_l = 0.38
hip_r = -0.38
hock_l = 0.38
hock_r = -0.38
horn_base_l = 0.15
horn_base_r = -0.15
horn_bend_l = 0.55
horn_bend_r = -0.55
horn_mid_l = 0.3
horn_mid_r = -0.3
horn_tip_l = 0.95
horn_tip_r = -0.95
shoulder_l = 0.2
shoulder_r = -0.2
stifle_l = 0.38
stifle_r = -0.38
wrist_l = 0.2
wrist_r = -0.2

[radius_depth_ft]
foreleg_l = 0.1
foreleg_r = 0.1
hindleg_l = 0.1
hindleg_r = 0.1
underline = 0.3

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[[bones]]
name = "horn_r"
part = "head"
parent = "skull"
joints = ["horn_base_r", "horn_mid_r", "horn_bend_r", "horn_tip_r"]

[[bones]]
name = "horn_l"
part = "head"
parent = "skull"
joints = ["horn_base_l", "horn_mid_l", "horn_bend_l", "horn_tip_l"]

[[bones]]
name = "ear_r"
part = "head"
parent = "skull"
joints = ["ear_base_r", "ear_tip_r"]

[[bones]]
name = "ear_l"
part = "head"
parent = "skull"
joints = ["ear_base_l", "ear_tip_l"]
