# Depth notes (the rig file loses comments on a re-bake; re-add them).
# Horns and ears are extra head bones; their spread is read off caprine-front
# (horns rise from the crown and curl out to +-1.0, ears stick out to +-0.7).
# Legs: forelegs +-0.20 (inner columns), hind legs +-0.38 (outer columns).
# [radius_depth_ft]: slim legs where they merge into the body in the front
# view, and an underline no wider than the belly (the leg outline slivers
# otherwise merge into it).
