horn_l = 0.05
foreleg_l = 0.1
foreleg_r = 0.1
hindleg_l = 0.1
hindleg_r = 0.1
underline = 0.3

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_1", "tail_2", "tail_3", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[[bones]]
name = "horn_r"
part = "head"
parent = "skull"
joints = ["horn_base_r", "horn_mid_r", "horn_bend_r", "horn_tip_r"]
radius_ft = 0.09

[[bones]]
name = "horn_l"
part = "head"
parent = "skull"
joints = ["horn_base_l", "horn_mid_l", "horn_bend_l", "horn_tip_l"]
radius_ft = 0.09

[[bones]]
name = "ear_r"
part = "head"
parent = "skull"
joints = ["ear_base_r", "ear_tip_r"]

[[bones]]
name = "ear_l"
part = "head"
parent = "skull"
joints = ["ear_base_l", "ear_tip_l"]
