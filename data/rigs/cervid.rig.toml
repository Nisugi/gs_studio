version = 2
family = "cervid"
body_type = "quadruped"
view = "side"
ref_ft = 5.5
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l", "horn_base_r", "horn_mid_r", "horn_bend_r", "horn_tip_r", "horn_base_l", "horn_mid_l", "horn_bend_l", "horn_tip_l", "ear_base_r", "ear_tip_r", "ear_base_l", "ear_tip_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.5429, 2.0878]
chest_front = [1.3024, 2.4755]
croup = [1.1016, 3.5737]
ear_base_l = [0.8185, 4.6719]
ear_base_r = [0.8185, 4.6719]
ear_tip_l = [0.7287, 4.8398]
ear_tip_r = [0.7287, 4.8398]
elbow_l = [0.6319, 1.7649]
elbow_r = [-0.5135, 1.8295]
eye_r = [1.6616, 4.2842]
forepaw_l = [0.6688, 0.1111]
forepaw_r = [0.3458, 0.0853]
groin = [-1.0212, 2.2817]
hindpaw_l = [-2.1291, 0.0594]
hindpaw_r = [-1.1632, 0.1111]
hip_l = [-1.2521, 2.9277]
hip_r = [-0.9795, 2.9277]
hock_l = [-2.1155, 1.1189]
hock_r = [-1.5785, 1.248]
horn_base_l = [1.053, 4.8011]
horn_base_r = [1.053, 4.8011]
horn_bend_l = [0.576, 5.3824]
horn_bend_r = [0.576, 5.3824]
horn_mid_l = [0.1955, 5.1241]
horn_mid_r = [0.1955, 5.1241]
horn_tip_l = [0.5478, 5.2791]
horn_tip_r = [0.5478, 5.2791]
mid_back = [1.4744, 3.5737]
nose = [2.3288, 3.7029]
poll = [1.0359, 4.4781]
shoulder_l = [1.0029, 2.9277]
shoulder_r = [0.7551, 2.9277]
sternum = [0.4812, 2.0878]
stifle_l = [-0.6989, 1.894]
stifle_r = [-0.7387, 1.9587]
tail_base = [0.3022, 3.2506]
tail_tip = [-0.4025, 2.7984]
withers = [1.7701, 3.6706]
wrist_l = [0.5455, 0.4729]
wrist_r = [0.2381, 0.5375]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# Horns and ears are extra head bones; their spread is read off caprine-front
# (horns rise from the crown and curl out to +-1.0, ears stick out to +-0.7).
# Legs: forelegs +-0.20 (inner columns), hind legs +-0.38 (outer columns).
# [radius_depth_ft]: slim legs where they merge into the body in the front
# view, and an underline no wider than the belly (the leg outline slivers
# otherwise merge into it).
[depth]
ear_base_l = 0.4
ear_base_r = -0.4
ear_tip_l = 0.68
ear_tip_r = -0.68
elbow_l = 0.2
elbow_r = -0.2
forepaw_l = 0.2
forepaw_r = -0.2
hindpaw_l = 0.38
hindpaw_r = -0.38
hip_l = 0.38
hip_r = -0.38
hock_l = 0.38
hock_r = -0.38
horn_base_l = 0.15
horn_base_r = -0.15
horn_bend_l = 0.55
horn_bend_r = -0.55
horn_mid_l = 0.3
horn_mid_r = -0.3
horn_tip_l = 0.95
horn_tip_r = -0.95
shoulder_l = 0.2
shoulder_r = -0.2
stifle_l = 0.38
stifle_r = -0.38
wrist_l = 0.2
wrist_r = -0.2

[radius_depth_ft]
horn_r = 0.05
horn_l = 0.05
foreleg_l = 0.1
foreleg_r = 0.1
hindleg_l = 0.1
hindleg_r = 0.1
underline = 0.3

[radius_ft]
horn_r = 0.06
horn_l = 0.06

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[[bones]]
name = "horn_r"
part = "head"
parent = "skull"
joints = ["horn_base_r", "horn_mid_r", "horn_bend_r", "horn_tip_r"]

[[bones]]
name = "horn_l"
part = "head"
parent = "skull"
joints = ["horn_base_l", "horn_mid_l", "horn_bend_l", "horn_tip_l"]

[[bones]]
name = "ear_r"
part = "head"
parent = "skull"
joints = ["ear_base_r", "ear_tip_r"]

[[bones]]
name = "ear_l"
part = "head"
parent = "skull"
joints = ["ear_base_l", "ear_tip_l"]
