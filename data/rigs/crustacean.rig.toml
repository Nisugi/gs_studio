part = "rightLeg"
parent = "thorax"
joints = ["leg3_base_r", "leg3_knee_r", "leg3_tip_r"]

[[bones]]
name = "leg3_l"
part = "leftLeg"
parent = "thorax"
joints = ["leg3_base_l", "leg3_knee_l", "leg3_tip_l"]

[[bones]]
name = "leg4_r"
part = "rightLeg"
parent = "thorax"
joints = ["leg4_base_r", "leg4_knee_r", "leg4_tip_r"]

[[bones]]
name = "leg4_l"
part = "leftLeg"
parent = "thorax"
joints = ["leg4_base_l", "leg4_knee_l", "leg4_tip_l"]

[[bones]]
name = "leg5_r"
