version = 2
family = "dragon_bat"
body_type = "winged_quadruped"
view = "side"
ref_ft = 5.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "wing_root_r", "wing_elbow_r", "wing_wrist_r", "wing_tip_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l", "wing_root_l", "wing_elbow_l", "wing_wrist_l", "wing_tip_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.4, 1.5]
chest_front = [0.9, 2.2]
croup = [-1.4, 2.3]
elbow_l = [0.6, 1.3]
elbow_r = [0.9, 1.35]
eye_r = [1.75, 4.0]
forepaw_l = [0.8, 0.15]
forepaw_r = [1.2, 0.15]
groin = [-1.2, 1.55]
hindpaw_l = [-1.25, 0.15]
hindpaw_r = [-0.85, 0.15]
hip_l = [-1.15, 1.85]
hip_r = [-0.9, 1.9]
hock_l = [-1.4, 0.55]
hock_r = [-1.05, 0.55]
mid_back = [-0.4, 2.6]
nose = [2.15, 3.85]
poll = [1.55, 4.15]
shoulder_l = [0.55, 2.05]
shoulder_r = [0.8, 2.1]
sternum = [0.5, 1.6]
stifle_l = [-1.2, 1.1]
stifle_r = [-0.8, 1.15]
tail_base = [-1.9, 1.95]
tail_tip = [-2.9, 0.4]
wing_elbow_l = [-1.3, 4.7]
wing_elbow_r = [-1.3, 4.7]
wing_root_l = [-0.1, 2.45]
wing_root_r = [-0.1, 2.45]
wing_tip_l = [-2.9, 4.9]
wing_tip_r = [-2.9, 4.9]
wing_wrist_l = [-2.3, 4.8]
wing_wrist_r = [-2.3, 4.8]
withers = [0.7, 2.75]
wrist_l = [0.6, 0.6]
wrist_r = [0.95, 0.6]

[depth]
elbow_l = 0.35
elbow_r = -0.35
forepaw_l = 0.35
forepaw_r = -0.35
hindpaw_l = 0.35
hindpaw_r = -0.35
hip_l = 0.35
hip_r = -0.35
hock_l = 0.35
hock_r = -0.35
shoulder_l = 0.35
shoulder_r = -0.35
stifle_l = 0.35
stifle_r = -0.35
wing_elbow_l = 1.4
wing_elbow_r = -1.4
wing_root_l = 0.25
wing_root_r = -0.25
wing_tip_l = 2.7
wing_tip_r = -2.7
wing_wrist_l = 2.2
wing_wrist_r = -2.2
wrist_l = 0.35
wrist_r = -0.35

[mirror]
foreleg_l = "foreleg_r"
hindleg_l = "hindleg_r"
wing_l = "wing_r"

[radius_depth_ft]
wing_r = 0.08
wing_l = 0.08
wing_hand_r = 0.08
wing_hand_l = 0.08

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[[bones]]
name = "wing_r"
part = "back"
parent = "spine"
joints = ["wing_root_r", "wing_elbow_r", "wing_wrist_r"]

[[bones]]
name = "wing_l"
part = "back"
parent = "spine"
joints = ["wing_root_l", "wing_elbow_l", "wing_wrist_l"]

[[bones]]
name = "wing_hand_r"
part = "back"
parent = "wing_r"
joints = ["wing_wrist_r", "wing_tip_r"]

[[bones]]
name = "wing_hand_l"
part = "back"
parent = "wing_l"
joints = ["wing_wrist_l", "wing_tip_l"]
