version = 2
family = "elemental"
body_type = "biped"
view = "front"
ref_ft = 8.0
axis = "crown"
joint_order = ["crown", "chin", "neck_base", "sternum", "pelvis", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "fingertip_r", "hip_r", "knee_r", "ankle_r", "toe_r", "eye_l", "shoulder_l", "elbow_l", "wrist_l", "fingertip_l", "hip_l", "knee_l", "ankle_l", "toe_l"]

[anchors]
head = "crown"
mouth = "chin"
saddle = "neck_base"

[joints]
ankle_l = [1.5, 0.6]
ankle_r = [-1.5, 0.6]
chin = [0.0, 7.4]
crown = [0.1, 8.4]
elbow_l = [2.3, 5.0]
elbow_r = [-2.3, 5.0]
eye_l = [0.22, 7.75]
eye_r = [-0.22, 7.75]
fingertip_l = [2.2, 3.4]
fingertip_r = [-2.2, 3.4]
hip_l = [0.9, 3.3]
hip_r = [-0.9, 3.3]
knee_l = [1.25, 1.9]
knee_r = [-1.25, 1.9]
neck_base = [0.0, 6.8]
pelvis = [0.0, 3.9]
shoulder_l = [1.6, 6.2]
shoulder_r = [-1.6, 6.2]
sternum = [0.0, 5.3]
toe_l = [2.3, 0.1]
toe_r = [-2.3, 0.1]
wrist_l = [2.4, 4.2]
wrist_r = [-2.4, 4.2]

[depth]
elbow_l = -1.9
elbow_r = 1.8
fingertip_l = -1.7
fingertip_r = 2.2
shoulder_l = -0.8
shoulder_r = 0.8
wrist_l = -1.8
wrist_r = 2.1

[radius_depth_ft]
arm_l = 0.6
arm_r = 0.6
clavicle = 0.8
hand_l = 0.45
hand_r = 0.45
neck = 0.8

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["crown", "chin"]
pivot = "chin"

[[bones]]
name = "neck"
part = "neck"
parent = "torso_upper"
joints = ["chin", "neck_base"]
pivot = "neck_base"

[[bones]]
name = "clavicle"
part = "chest"
parent = "torso_upper"
joints = ["shoulder_r", "neck_base", "shoulder_l"]
pivot = "neck_base"
radius_ft = 0.6

[[bones]]
name = "torso_upper"
part = "chest"
parent = "torso_lower"
joints = ["neck_base", "sternum"]
pivot = "sternum"

[[bones]]
name = "torso_lower"
part = "abdomen"
joints = ["sternum", "pelvis"]
pivot = "pelvis"

[[bones]]
name = "arm_r"
part = "rightArm"
parent = "clavicle"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "hand_r"
part = "rightHand"
parent = "arm_r"
joints = ["wrist_r", "fingertip_r"]

[[bones]]
name = "arm_l"
part = "leftArm"
parent = "clavicle"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "hand_l"
part = "leftHand"
parent = "arm_l"
joints = ["wrist_l", "fingertip_l"]

[[bones]]
name = "leg_r"
part = "rightLeg"
parent = "torso_lower"
joints = ["hip_r", "knee_r", "ankle_r", "toe_r"]

[[bones]]
name = "leg_l"
part = "leftLeg"
parent = "torso_lower"
joints = ["hip_l", "knee_l", "ankle_l", "toe_l"]
