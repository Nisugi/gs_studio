version = 2
family = "elemental_lava"
body_type = "mound"
view = "front"
ref_ft = 15.0
axis = "crown"
joint_order = ["crown", "crest", "belly", "base", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "fingertip_r", "eye_l", "shoulder_l", "elbow_l", "wrist_l", "fingertip_l"]

[anchors]
head = "crown"
mouth = "crest"
saddle = "crest"

[joints]
base = [0.0, 0.2]
belly = [0.0, 6.0]
crest = [0.0, 12.5]
crown = [0.0, 14.6]
elbow_l = [9.5, 6.8]
elbow_r = [-9.5, 6.8]
eye_l = [1.5, 12.0]
eye_r = [-1.5, 12.0]
fingertip_l = [12.6, 3.5]
fingertip_r = [-12.6, 3.5]
shoulder_l = [5.0, 8.5]
shoulder_r = [-5.0, 8.5]
wrist_l = [12.0, 4.5]
wrist_r = [-12.0, 4.5]

[depth]
base = 0.0
belly = -2.0
crest = -3.0
crown = -3.0
elbow_l = 9.0
elbow_r = 9.0
eye_l = 7.0
eye_r = 7.0
fingertip_l = 13.0
fingertip_r = 13.0
shoulder_l = 6.0
shoulder_r = 6.0
wrist_l = 11.5
wrist_r = 11.5

[[bones]]
name = "skull"
part = "head"
parent = "mass"
joints = ["crest", "crown"]
pivot = "crest"

[[bones]]
name = "mass"
part = "chest"
parent = "core"
joints = ["belly", "crest"]
pivot = "belly"

[[bones]]
name = "core"
part = "abdomen"
joints = ["base", "belly"]
pivot = "base"

[[bones]]
name = "arm_r"
part = "rightArm"
parent = "mass"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "arm_l"
part = "leftArm"
parent = "mass"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "hand_r"
part = "rightHand"
parent = "arm_r"
joints = ["wrist_r", "fingertip_r"]

[[bones]]
name = "hand_l"
part = "leftHand"
parent = "arm_l"
joints = ["wrist_l", "fingertip_l"]
