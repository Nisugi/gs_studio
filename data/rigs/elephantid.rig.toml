version = 2
family = "elephantid"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l", "trunk_1", "trunk_2", "trunk_3", "trunk_4", "trunk_tip", "tusk_base_r", "tusk_bend_r", "tusk_curl_r", "tusk_tip_r", "tusk_base_l", "tusk_bend_l", "tusk_curl_l", "tusk_tip_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
