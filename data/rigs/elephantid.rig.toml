forepaw_r = [0.6, 0.08]
groin = [-2.0, 1.0]
hindpaw_l = [-2.57, 0.08]
hindpaw_r = [-1.42, 0.08]
hip_l = [-2.22, 2.15]
hip_r = [-1.78, 2.15]
hock_l = [-2.46, 0.75]
hock_r = [-1.58, 0.75]
mid_back = [-1.15, 2.5]
nose = [1.28, 2.0]
poll = [0.48, 2.85]
shoulder_l = [-0.2, 2.3]
shoulder_r = [0.32, 2.3]
sternum = [0.0, 1.35]
stifle_l = [-2.36, 1.5]
stifle_r = [-1.61, 1.4]
tail_base = [-2.42, 1.95]
tail_tip = [-2.57, 1.44]
trunk_1 = [1.45, 1.83]
trunk_2 = [1.48, 1.45]
trunk_3 = [1.53, 1.05]
trunk_4 = [1.58, 0.66]
trunk_tip = [1.44, 0.41]
tusk_base_l = [1.56, 1.63]
tusk_base_r = [1.72, 1.7]
tusk_bend_l = [1.95, 1.47]
tusk_bend_r = [2.03, 1.64]
tusk_curl_l = [2.58, 1.67]
tusk_curl_r = [2.43, 1.83]
tusk_tip_l = [2.81, 2.05]
tusk_tip_r = [2.65, 2.18]
withers = [-0.18, 2.72]
wrist_l = [-0.2, 0.6]
wrist_r = [0.44, 0.6]

[depth]
tusk_base_l = 0.3
tusk_base_r = -0.3
tusk_bend_l = 0.6
tusk_bend_r = -0.6
tusk_curl_l = 0.9
tusk_curl_r = -0.9
tusk_tip_l = 0.85
tusk_tip_r = -0.85

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]
radius_ft = 0.172

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[[bones]]
name = "trunk"
part = "head"
parent = "skull"
joints = ["trunk_1", "trunk_2", "trunk_3", "trunk_4", "trunk_tip"]
radius_ft = 0.1

[[bones]]
name = "tusk_r"
part = "head"
parent = "skull"
joints = ["tusk_base_r", "tusk_bend_r", "tusk_curl_r", "tusk_tip_r"]

[[bones]]
name = "tusk_l"
part = "head"
parent = "skull"
joints = ["tusk_base_l", "tusk_bend_l", "tusk_curl_l", "tusk_tip_l"]
