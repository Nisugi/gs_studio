version = 2
family = "equine"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.025, 1.8]
chest_front = [1.3, 2.125]
croup = [-1.05, 2.85]
elbow_l = [0.95, 1.55]
elbow_r = [0.69, 1.55]
eye_r = [2.1, 3.6]
forepaw_l = [1.1, 0.12]
forepaw_r = [0.8, 0.12]
groin = [-0.9, 1.95]
hindpaw_l = [-1.6, 0.08]
hindpaw_r = [-1.02, 0.15]
hip_l = [-1.35, 2.575]
hip_r = [-1.1, 2.55]
hock_l = [-1.62, 1.1]
hock_r = [-1.275, 1.1]
mid_back = [-0.2, 2.85]
nose = [2.45, 3.15]
poll = [1.9, 3.525]
shoulder_l = [0.925, 2.0]
shoulder_r = [0.75, 2.0]
sternum = [0.85, 1.75]
stifle_l = [-1.275, 1.7]
stifle_r = [-1.0, 1.75]
tail_base = [-1.75, 2.7]
tail_tip = [-2.25, 1.2]
withers = [0.625, 3.0]
wrist_l = [0.95, 0.45]
wrist_r = [0.67, 0.45]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# equine-front shows the forelegs at +-0.26 and the hind legs as thin slivers
# just outside them (+-0.38); the guess read the elbow outline slivers at
# y 1.6-1.9 (x +-0.5) as the limb and bent the forelegs out at the elbow.
# [radius_depth_ft] keeps the legs slim where they run up into the chest,
# which the front view shows as one solid span.
[depth]
elbow_l = 0.27
elbow_r = -0.27
forepaw_l = 0.27
forepaw_r = -0.27
hindpaw_l = 0.36
hindpaw_r = -0.36
hip_l = 0.36
hip_r = -0.36
hock_l = 0.36
hock_r = -0.36
shoulder_l = 0.27
shoulder_r = -0.27
stifle_l = 0.36
stifle_r = -0.36
wrist_l = 0.27
wrist_r = -0.27

[radius_depth_ft]
foreleg_l = 0.12
foreleg_r = 0.12
hindleg_l = 0.12
hindleg_r = 0.12

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
