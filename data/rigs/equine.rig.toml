# Depth notes (the rig file loses comments on a re-bake; re-add them).
# equine-front shows the forelegs at +-0.26 and the hind legs as thin slivers
# just outside them (+-0.38); the guess read the elbow outline slivers at
# y 1.6-1.9 (x +-0.5) as the limb and bent the forelegs out at the elbow.
# [radius_depth_ft] keeps the legs slim where they run up into the chest,
# which the front view shows as one solid span.
[depth]
elbow_l = 0.2166
elbow_r = -0.2166
forepaw_l = 0.2415
forepaw_r = -0.2415
hindpaw_l = 0.6005
hindpaw_r = -0.6005
hip_l = 0.2531
hip_r = -0.2531
hock_l = 0.2531
hock_r = -0.2531
shoulder_l = 0.0295
shoulder_r = -0.0295
stifle_l = 0.1587
stifle_r = -0.1587
wrist_l = 0.27
wrist_r = -0.27

belly = 0.1995
chest_front = 0.2814
croup = 0.2672
groin = 0.0410
mid_back = 0.2120
tail_base = 0.1603
tail_1 = 0.1737
tail_2 = 0.187
tail_3 = 0.2004
tail_tip = 0.2138
[radius_depth_ft]
foreleg_l = 0.12
foreleg_r = 0.12
hindleg_l = 0.12
hindleg_r = 0.12

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_1", "tail_2", "tail_3", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
