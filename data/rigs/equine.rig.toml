version = 2
family = "equine"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.2358, 1.7643]
chest_front = [1.064, 2.089]
croup = [-1.2307, 2.8133]
elbow_l = [0.6094, 1.5145]
elbow_r = [0.3147, 1.5145]
eye_r = [1.9773, 3.5626]
forepaw_l = [0.5272, 0.0859]
forepaw_r = [0.5114, 0.0859]
groin = [-1.1673, 1.9142]
hindpaw_l = [-1.8747, 0.046]
hindpaw_r = [-1.2953, 0.1159]
hip_l = [-1.5688, 2.5386]
hip_r = [-1.3077, 2.5136]
hock_l = [-1.5355, 1.065]
hock_r = [-1.5343, 1.065]
mid_back = [-0.3886, 2.8133]
nose = [2.3256, 3.113]
poll = [1.7689, 3.4876]
shoulder_l = [0.6711, 1.9641]
shoulder_r = [0.4952, 1.9641]
sternum = [0.601, 1.7143]
stifle_l = [-1.4765, 1.6644]
stifle_r = [-1.1435, 1.7143]
tail_base = [-1.7, 2.5]
tail_tip = [-2.1, 0.6]
withers = [0.4239, 2.9631]
wrist_l = [0.3907, 0.4156]
wrist_r = [0.3937, 0.4156]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# equine-front shows the forelegs at +-0.26 and the hind legs as thin slivers
# just outside them (+-0.38); the guess read the elbow outline slivers at
# y 1.6-1.9 (x +-0.5) as the limb and bent the forelegs out at the elbow.
# [radius_depth_ft] keeps the legs slim where they run up into the chest,
# which the front view shows as one solid span.
[depth]
elbow_l = 0.27
elbow_r = -0.27
forepaw_l = 0.27
forepaw_r = -0.27
hindpaw_l = 0.36
hindpaw_r = -0.36
hip_l = 0.36
hip_r = -0.36
hock_l = 0.36
hock_r = -0.36
shoulder_l = 0.27
shoulder_r = -0.27
stifle_l = 0.36
stifle_r = -0.36
wrist_l = 0.27
wrist_r = -0.27

[radius_depth_ft]
foreleg_l = 0.12
foreleg_r = 0.12
hindleg_l = 0.12
hindleg_r = 0.12

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
