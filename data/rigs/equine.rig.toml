# Depth notes (the rig file loses comments on a re-bake; re-add them).
# equine-front shows the forelegs at +-0.26 and the hind legs as thin slivers
# just outside them (+-0.38); the guess read the elbow outline slivers at
# y 1.6-1.9 (x +-0.5) as the limb and bent the forelegs out at the elbow.
# [radius_depth_ft] keeps the legs slim where they run up into the chest,
# which the front view shows as one solid span.
[depth]
elbow_l = 0.4304
elbow_r = -0.4304
forepaw_l = 0.1881
forepaw_r = -0.1881
hindpaw_l = 0.4259
hindpaw_r = -0.4259
hip_l = 0.2531
hip_r = -0.2531
hock_l = 0.2531
hock_r = -0.2531
