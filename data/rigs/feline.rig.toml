version = 2
family = "feline"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_1", "tail_2", "tail_3", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.1980, 1.4550]
chest_front = [1.7290, 2.1470]
croup = [-1.3325, 2.4875]
elbow_l = [1.0980, 1.3175]
elbow_r = [1.4360, 1.2670]
eye_r = [2.5, 2.85]
forepaw_l = [1.306, 0.0]
forepaw_r = [1.7120, 0.1000]
groin = [-1.3450, 1.7680]
hindpaw_l = [-1.1125, 0.1425]
hindpaw_r = [-0.3300, 0.1425]
hip_l = [-1.1480, 2.1295]
hip_r = [-1.0900, 2.2365]
hock_l = [-1.5945, 0.6275]
hock_r = [-0.8875, 0.7345]
mid_back = [-0.3, 2.75]
nose = [2.75, 2.55]
poll = [2.1, 3]
shoulder_l = [1.1430, 2.2400]
shoulder_r = [1.5125, 2.2015]
sternum = [1.1230, 1.5140]
stifle_l = [-1.4100, 1.1600]
stifle_r = [-0.7050, 1.2255]
tail_base = [-1.7080, 2.1875]
tail_1 = [-1.9500, 1.1500]
tail_2 = [-2.4400, 0.8800]
tail_3 = [-2.7820, 1.2100]
tail_tip = [-2.6000, 1.6000]
withers = [1.4550, 2.7585]
wrist_l = [0.9650, 0.4500]
wrist_r = [1.5, 0.45]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# feline-front is drawn as a SITTING cat, off-centre: body and head centred
# on x = -0.32, the tail curled out to the right (x 0.46..1.2). So the
# centre line is moved to -0.32, and every leg sits 0.40 either side of it:
# at the leg rows the front view shows one merged inner+outer limb band per
# side, centred at -0.72 / +0.08, and matching that keeps each leg a straight
# column instead of a zig-zag. The tail stays behind the body.
# [radius_depth_ft] on the legs: without it the far legs read the curled tail
# (0.04 ft away at y 0.9-1.1, closed by the hairline merge) as leg and grow a
# fin, and the thighs read the whole haunch.
[depth]
belly = -0.0035
chest_front = -0.0485
croup = 0.1420
elbow_l = 0.3550
elbow_r = -0.6770
forepaw_l = 0.0970
forepaw_r = -0.4190
groin = -0.1835
hindpaw_l = 0.1975
hindpaw_r = -0.5195
hip_l = -0.0050
hip_r = -0.3170
hock_l = 0.3100
hock_r = -0.6320
mid_back = -0.161
nose = -0.161
poll = -0.161
shoulder_l = 0.0400
shoulder_r = -0.3620
sternum = -0.4190
stifle_l = 0.3550
stifle_r = -0.6770
tail_base = -0.5660
tail_tip = 0.0640
withers = -0.1160
wrist_l = 0.2995
wrist_r = -0.6215

tail_1 = -0.2250
tail_2 = 0.1125
tail_3 = -0.1800
[radius_depth_ft]
foreleg_l = 0.3
foreleg_r = 0.3
hindleg_l = 0.3
hindleg_r = 0.3

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_1", "tail_2", "tail_3", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
