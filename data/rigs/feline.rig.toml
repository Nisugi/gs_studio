version = 2
family = "feline"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.3, 1.5]
chest_front = [1.9, 2.0]
croup = [-1.4, 2.6]
elbow_l = [1.2, 1.25]
elbow_r = [1.55, 1.3]
eye_r = [2.5, 2.85]
forepaw_l = [1.15, 0.1]
forepaw_r = [1.7, 0.1]
groin = [-1.3, 1.6]
hindpaw_l = [-1.45, 0.12]
hindpaw_r = [-0.6, 0.12]
hip_l = [-1.25, 2.05]
hip_r = [-1.0, 2.1]
hock_l = [-1.65, 0.65]
hock_r = [-1.0, 0.7]
mid_back = [-0.3, 2.75]
nose = [2.75, 2.55]
poll = [2.1, 3.0]
shoulder_l = [1.2, 2.15]
shoulder_r = [1.4, 2.2]
sternum = [1.0, 1.55]
stifle_l = [-1.5, 1.25]
stifle_r = [-0.75, 1.35]
tail_base = [-1.9, 2.3]
tail_tip = [-2.4, 1.0]
withers = [1.5, 2.85]
wrist_l = [1.1, 0.45]
wrist_r = [1.5, 0.45]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# feline-front is drawn as a SITTING cat, off-centre: body and head centred
# on x = -0.32, the tail curled out to the right (x 0.46..1.2). So the
# centre line is moved to -0.32, and every leg sits 0.40 either side of it:
# at the leg rows the front view shows one merged inner+outer limb band per
# side, centred at -0.72 / +0.08, and matching that keeps each leg a straight
# column instead of a zig-zag. The tail stays behind the body.
# [radius_depth_ft] on the legs: without it the far legs read the curled tail
# (0.04 ft away at y 0.9-1.1, closed by the hairline merge) as leg and grow a
# fin, and the thighs read the whole haunch.
[depth]
belly = -0.161
chest_front = -0.161
croup = -0.161
elbow_l = 0.175
elbow_r = -0.497
forepaw_l = 0.175
forepaw_r = -0.497
groin = -0.161
hindpaw_l = 0.175
hindpaw_r = -0.497
hip_l = 0.175
hip_r = -0.497
hock_l = 0.175
hock_r = -0.497
mid_back = -0.161
nose = -0.161
poll = -0.161
shoulder_l = 0.175
shoulder_r = -0.497
sternum = -0.161
stifle_l = 0.175
stifle_r = -0.497
tail_base = -0.161
tail_tip = -0.161
withers = -0.161
wrist_l = 0.175
wrist_r = -0.497

[radius_depth_ft]
foreleg_l = 0.3
foreleg_r = 0.3
hindleg_l = 0.3
hindleg_r = 0.3

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
