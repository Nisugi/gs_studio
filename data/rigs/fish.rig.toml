version = 2
family = "fish"
body_type = "fish"
view = "side"
ref_ft = 4.0
axis = "crown"
joint_order = ["snout", "gill", "mid", "peduncle", "tail_end", "dorsal_base", "dorsal_tip", "eye_r", "pec_root_r", "pec_tip_r", "pec_root_l", "pec_tip_l"]

[anchors]
head = "gill"
mouth = "snout"
saddle = "dorsal_base"

[joints]
dorsal_base = [0.3, 2.9]
dorsal_tip = [0.2, 3.8]
eye_r = [4.0, 2.45]
gill = [2.9, 2.0]
mid = [0.5, 2.0]
pec_root_l = [1.5, 1.2]
pec_root_r = [1.5, 1.2]
pec_tip_l = [0.7, 0.1]
pec_tip_r = [0.7, 0.1]
peduncle = [-2.7, 1.9]
snout = [4.7, 1.85]
tail_end = [-4.7, 2.5]

[depth]
pec_root_l = 0.7
pec_root_r = -0.7
pec_tip_l = 2.6
pec_tip_r = -2.6

[radius_depth_ft]
dorsal = 0.06
tail = 0.08
pec_r = 0.06
pec_l = 0.06

[mirror]
pec_l = "pec_r"

[[bones]]
name = "skull"
part = "head"
parent = "body"
joints = ["snout", "gill"]
pivot = "gill"

[[bones]]
name = "body"
part = "chest"
joints = ["gill", "mid"]
pivot = "mid"

[[bones]]
name = "belly"
part = "abdomen"
parent = "body"
joints = ["mid", "peduncle"]

[[bones]]
name = "tail"
part = "back"
parent = "belly"
joints = ["peduncle", "tail_end"]

[[bones]]
name = "dorsal"
part = "back"
parent = "body"
joints = ["dorsal_base", "dorsal_tip"]

[[bones]]
name = "pec_r"
part = "rightArm"
parent = "body"
joints = ["pec_root_r", "pec_tip_r"]

[[bones]]
name = "pec_l"
part = "leftArm"
parent = "body"
joints = ["pec_root_l", "pec_tip_l"]
