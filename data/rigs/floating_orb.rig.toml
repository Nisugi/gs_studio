version = 2
family = "floating_orb"
body_type = "floating_orb"
view = "front"
ref_ft = 2.0
axis = "crown"
joint_order = ["crown", "chin", "eye_r", "leg1_root_r", "leg1_mid_r", "leg1_tip_r", "leg2_root_r", "leg2_mid_r", "leg2_tip_r", "eye_l", "leg1_root_l", "leg1_mid_l", "leg1_tip_l", "leg2_root_l", "leg2_mid_l", "leg2_tip_l"]

[anchors]
head = "crown"
mouth = "chin"
saddle = "crown"

[joints]
chin = [0.0, 1.15]
crown = [0.0, 1.95]
eye_l = [0.15, 1.6]
eye_r = [-0.15, 1.6]
leg1_mid_l = [0.45, 0.6]
leg1_mid_r = [-0.45, 0.6]
leg1_root_l = [0.3, 1.1]
leg1_root_r = [-0.3, 1.1]
leg1_tip_l = [0.5, 0.1]
leg1_tip_r = [-0.5, 0.1]
leg2_mid_l = [0.15, 0.6]
leg2_mid_r = [-0.15, 0.6]
leg2_root_l = [0.12, 1.1]
leg2_root_r = [-0.12, 1.1]
leg2_tip_l = [0.15, 0.1]
leg2_tip_r = [-0.15, 0.1]

[depth]
chin = 0.0
crown = 0.0
eye_l = 0.35
eye_r = 0.35
leg1_mid_l = 0.1
leg1_mid_r = 0.1
leg1_root_l = 0.0
leg1_root_r = 0.0
leg1_tip_l = 0.15
leg1_tip_r = 0.15
leg2_mid_l = -0.25
leg2_mid_r = 0.25
leg2_root_l = -0.2
leg2_root_r = 0.2
leg2_tip_l = -0.3
leg2_tip_r = 0.3

[radius_ft]
leg1_r = 0.08
leg1_l = 0.08
leg2_r = 0.07
leg2_l = 0.07

[[bones]]
name = "orb"
part = "head"
joints = ["crown", "chin"]
pivot = "crown"

[[bones]]
name = "leg1_r"
part = "rightLeg"
parent = "orb"
joints = ["leg1_root_r", "leg1_mid_r", "leg1_tip_r"]

[[bones]]
name = "leg1_l"
part = "leftLeg"
parent = "orb"
joints = ["leg1_root_l", "leg1_mid_l", "leg1_tip_l"]

[[bones]]
name = "leg2_r"
part = "rightLeg"
parent = "orb"
joints = ["leg2_root_r", "leg2_mid_r", "leg2_tip_r"]

[[bones]]
name = "leg2_l"
part = "leftLeg"
parent = "orb"
joints = ["leg2_root_l", "leg2_mid_l", "leg2_tip_l"]
