version = 2
family = "ghost"
body_type = "biped"
view = "front"
ref_ft = 6.0
axis = "crown"
joint_order = ["crown", "chin", "neck_base", "sternum", "pelvis", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "fingertip_r", "hip_r", "knee_r", "ankle_r", "toe_r", "eye_l", "shoulder_l", "elbow_l", "wrist_l", "fingertip_l", "hip_l", "knee_l", "ankle_l", "toe_l"]

[anchors]
head = "crown"
mouth = "chin"
saddle = "neck_base"

[joints]
ankle_l = [0.8, 0.4]
ankle_r = [-0.8, 0.4]
chin = [0.0, 5.05]
crown = [0.0, 6.0]
elbow_l = [0.95, 3.3]
elbow_r = [-0.95, 3.3]
eye_l = [0.14, 5.5]
eye_r = [-0.14, 5.5]
fingertip_l = [0.97, 2.52]
fingertip_r = [-0.97, 2.52]
hip_l = [0.35, 2.2]
hip_r = [-0.35, 2.2]
knee_l = [0.5, 1.3]
knee_r = [-0.5, 1.3]
neck_base = [0.0, 4.75]
pelvis = [0.0, 2.4]
shoulder_l = [0.75, 4.4]
shoulder_r = [-0.75, 4.4]
sternum = [0.0, 3.6]
toe_l = [1.5, 0.08]
toe_r = [-1.5, 0.08]
wrist_l = [1.0, 2.8]
wrist_r = [-1.0, 2.8]

[radius_depth_ft]
clavicle = 0.45

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["crown", "chin"]
pivot = "chin"

[[bones]]
name = "neck"
part = "neck"
parent = "torso_upper"
joints = ["chin", "neck_base"]
pivot = "neck_base"

[[bones]]
name = "clavicle"
part = "chest"
parent = "torso_upper"
joints = ["shoulder_r", "neck_base", "shoulder_l"]
pivot = "neck_base"
radius_ft = 0.35

[[bones]]
name = "torso_upper"
part = "chest"
parent = "torso_lower"
joints = ["neck_base", "sternum"]
pivot = "sternum"

[[bones]]
name = "torso_lower"
part = "abdomen"
joints = ["sternum", "pelvis"]
pivot = "pelvis"

[[bones]]
name = "arm_r"
part = "rightArm"
parent = "clavicle"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "hand_r"
part = "rightHand"
parent = "arm_r"
joints = ["wrist_r", "fingertip_r"]

[[bones]]
name = "arm_l"
part = "leftArm"
parent = "clavicle"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "hand_l"
part = "leftHand"
parent = "arm_l"
joints = ["wrist_l", "fingertip_l"]

[[bones]]
name = "leg_r"
part = "rightLeg"
parent = "torso_lower"
joints = ["hip_r", "knee_r", "ankle_r", "toe_r"]

[[bones]]
name = "leg_l"
part = "leftLeg"
parent = "torso_lower"
joints = ["hip_l", "knee_l", "ankle_l", "toe_l"]
