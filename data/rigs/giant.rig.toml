version = 2
family = "giant"
body_type = "biped"
view = "front"
ref_ft = 6.0
axis = "crown"
joint_order = ["crown", "chin", "neck_base", "sternum", "pelvis", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "fingertip_r", "hip_r", "knee_r", "ankle_r", "toe_r", "eye_l", "shoulder_l", "elbow_l", "wrist_l", "fingertip_l", "hip_l", "knee_l", "ankle_l", "toe_l"]

[anchors]
head = "crown"
mouth = "chin"
saddle = "neck_base"

[joints]
ankle_l = [1.0, 0.5]
ankle_r = [-1.0, 0.5]
chin = [0, 5.4]
crown = [0, 5.98]
elbow_l = [1.8, 3.2]
elbow_r = [-1.8, 3.2]
eye_l = [0.15, 5.65]
eye_r = [-0.15, 5.65]
fingertip_l = [1.9, 1.55]
fingertip_r = [-1.9, 1.55]
hip_l = [0.55, 2.6]
hip_r = [-0.55, 2.6]
knee_l = [0.85, 1.2]
knee_r = [-0.85, 1.2]
neck_base = [0, 5.25]
pelvis = [0, 2.85]
shoulder_l = [1.1, 4.85]
shoulder_r = [-1.1, 4.85]
sternum = [0, 4.4]
toe_l = [1.25, 0.1]
toe_r = [-1.25, 0.1]
wrist_l = [1.95, 2.3]
wrist_r = [-1.95, 2.3]

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["crown", "chin"]
pivot = "chin"

[[bones]]
name = "neck"
part = "neck"
parent = "torso_upper"
joints = ["chin", "neck_base"]
pivot = "neck_base"

[[bones]]
name = "clavicle"
part = "chest"
parent = "torso_upper"
joints = ["shoulder_r", "neck_base", "shoulder_l"]
pivot = "neck_base"

[[bones]]
name = "torso_upper"
part = "chest"
parent = "torso_lower"
joints = ["neck_base", "sternum"]
pivot = "sternum"

[[bones]]
name = "torso_lower"
part = "abdomen"
joints = ["sternum", "pelvis"]
pivot = "pelvis"

[[bones]]
name = "arm_r"
part = "rightArm"
parent = "clavicle"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "hand_r"
part = "rightHand"
parent = "arm_r"
joints = ["wrist_r", "fingertip_r"]

[[bones]]
name = "arm_l"
part = "leftArm"
parent = "clavicle"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "hand_l"
part = "leftHand"
parent = "arm_l"
joints = ["wrist_l", "fingertip_l"]

[[bones]]
name = "leg_r"
part = "rightLeg"
parent = "torso_lower"
joints = ["hip_r", "knee_r", "ankle_r", "toe_r"]

[[bones]]
name = "leg_l"
part = "leftLeg"
parent = "torso_lower"
joints = ["hip_l", "knee_l", "ankle_l", "toe_l"]
