version = 2
family = "golem"
body_type = "biped"
view = "front"
ref_ft = 6.0
axis = "crown"
joint_order = ["crown", "chin", "neck_base", "sternum", "pelvis", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "fingertip_r", "hip_r", "knee_r", "ankle_r", "toe_r", "eye_l", "shoulder_l", "elbow_l", "wrist_l", "fingertip_l", "hip_l", "knee_l", "ankle_l", "toe_l"]

[anchors]
head = "crown"
mouth = "chin"
saddle = "neck_base"

[joints]
ankle_l = [0.95, 0.4]
ankle_r = [-0.95, 0.4]
chin = [0.0, 5.5]
crown = [0.0, 5.97]
elbow_l = [2.33, 3.1]
elbow_r = [-2.33, 3.1]
eye_l = [0.18, 5.62]
eye_r = [-0.18, 5.62]
fingertip_l = [2.65, 0.65]
fingertip_r = [-2.65, 0.65]
hip_l = [0.8, 2.05]
hip_r = [-0.8, 2.05]
knee_l = [0.85, 1.2]
knee_r = [-0.85, 1.2]
neck_base = [0.0, 5.3]
pelvis = [0.0, 2.3]
shoulder_l = [2.1, 4.85]
shoulder_r = [-2.1, 4.85]
sternum = [0.0, 3.9]
toe_l = [1.6, 0.12]
toe_r = [-1.6, 0.12]
wrist_l = [2.5, 1.85]
wrist_r = [-2.5, 1.85]

[depth]
ankle_l = -0.85
ankle_r = 0.45
elbow_l = -1.2
elbow_r = 0.9
fingertip_l = -1.7
fingertip_r = 1.7
hip_l = -0.35
hip_r = 0.25
knee_l = -0.65
knee_r = 0.45
toe_l = -0.3
toe_r = 1.1
wrist_l = -1.6
wrist_r = 1.5

[radius_depth_ft]
arm_l = 0.7
arm_r = 0.7
clavicle = 0.6
torso_lower = 0.9
torso_upper = 1.7

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["crown", "chin"]
pivot = "chin"
radius_ft = 0.5

[[bones]]
name = "neck"
part = "neck"
parent = "torso_upper"
joints = ["chin", "neck_base"]
pivot = "neck_base"
radius_ft = 0.42

[[bones]]
name = "clavicle"
part = "chest"
parent = "torso_upper"
joints = ["shoulder_r", "neck_base", "shoulder_l"]
pivot = "neck_base"
radius_ft = 0.5

[[bones]]
name = "torso_upper"
part = "chest"
parent = "torso_lower"
joints = ["neck_base", "sternum"]
pivot = "sternum"
radius_ft = 1.05

[[bones]]
name = "torso_lower"
part = "abdomen"
joints = ["sternum", "pelvis"]
pivot = "pelvis"

[[bones]]
name = "arm_r"
part = "rightArm"
parent = "clavicle"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "hand_r"
part = "rightHand"
parent = "arm_r"
joints = ["wrist_r", "fingertip_r"]

[[bones]]
name = "arm_l"
part = "leftArm"
parent = "clavicle"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "hand_l"
part = "leftHand"
parent = "arm_l"
joints = ["wrist_l", "fingertip_l"]

[[bones]]
name = "leg_r"
part = "rightLeg"
parent = "torso_lower"
joints = ["hip_r", "knee_r", "ankle_r", "toe_r"]

[[bones]]
name = "leg_l"
part = "leftLeg"
parent = "torso_lower"
joints = ["hip_l", "knee_l", "ankle_l", "toe_l"]
