[[bones]]
name = "torso_upper"
part = "chest"
joints = ["neck_base", "sternum"]

[[bones]]
name = "torso_lower"
part = "abdomen"
joints = ["sternum", "pelvis"]

[[bones]]
name = "arm_r"
part = "rightArm"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "hand_r"
part = "rightHand"
joints = ["wrist_r", "fingertip_r"]

[[bones]]
name = "arm_l"
part = "leftArm"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "hand_l"
part = "leftHand"
joints = ["wrist_l", "fingertip_l"]

[[bones]]
name = "leg_r"
part = "rightLeg"
joints = ["hip_r", "knee_r", "ankle_r", "toe_r"]

[[bones]]
name = "leg_l"
part = "leftLeg"
joints = ["hip_l", "knee_l", "ankle_l", "toe_l"]
