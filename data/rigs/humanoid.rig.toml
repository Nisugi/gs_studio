family = "humanoid"
body_type = "biped"
view = "front"
ref_ft = 6.0
axis = "crown"

[anchors]
head = "crown"
mouth = "chin"
saddle = "neck_base"

[joints]
ankle_l = [0.3, 0.25]
ankle_r = [-0.3, 0.25]
chin = [0.0, 5.2]
crown = [0.0, 5.98]
elbow_l = [0.8, 3.9]
elbow_r = [-0.8, 3.9]
eye_l = [0.12, 5.65]
eye_r = [-0.12, 5.65]
fingertip_l = [1.0, 2.5]
fingertip_r = [-1.0, 2.5]
hip_l = [0.3, 3.0]
hip_r = [-0.3, 3.0]
knee_l = [0.33, 1.65]
knee_r = [-0.33, 1.65]
neck_base = [0.0, 4.95]
pelvis = [0.0, 3.1]
shoulder_l = [0.55, 4.8]
shoulder_r = [-0.55, 4.8]
sternum = [0.0, 4.2]
toe_l = [0.42, 0.03]
toe_r = [-0.42, 0.03]
wrist_l = [0.95, 3.05]
wrist_r = [-0.95, 3.05]

[[bones]]
name = "skull"
part = "head"
joints = ["crown", "chin"]

[[bones]]
name = "neck"
part = "neck"
joints = ["chin", "neck_base"]

[[bones]]
name = "clavicle"
part = "chest"
