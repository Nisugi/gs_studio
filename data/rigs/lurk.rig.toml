[[bones]]
name = "arm_r"
part = "rightArm"
parent = "clavicle"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "hand_r"
part = "rightHand"
parent = "arm_r"
joints = ["wrist_r", "fingertip_r"]

[[bones]]
name = "arm_l"
part = "leftArm"
