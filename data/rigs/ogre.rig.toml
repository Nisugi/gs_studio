version = 2
family = "ogre"
body_type = "biped"
view = "front"
ref_ft = 6.0
axis = "crown"
joint_order = ["crown", "chin", "neck_base", "sternum", "pelvis", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "fingertip_r", "hip_r", "knee_r", "ankle_r", "toe_r", "eye_l", "shoulder_l", "elbow_l", "wrist_l", "fingertip_l", "hip_l", "knee_l", "ankle_l", "toe_l"]

[anchors]
head = "crown"
mouth = "chin"
saddle = "neck_base"

[joints]
ankle_l = [0.8036, 0.281]
ankle_r = [-0.8988, 0.281]
chin = [0.0021, 5.2654]
crown = [-0.0545, 5.9406]
elbow_l = [2.6213, 3.3292]
elbow_r = [-2.6184, 3.3292]
eye_l = [0.2802, 5.5633]
eye_r = [-0.361, 5.5633]
fingertip_l = [2.7192, 1.8399]
fingertip_r = [-2.7152, 1.8399]
hip_l = [0.8366, 2.0881]
hip_r = [-0.9113, 2.0881]
knee_l = [1.0203, 1.0952]
knee_r = [-1.1188, 1.0952]
neck_base = [0.5116, 4.8682]
pelvis = [-0.0398, 2.5845]
shoulder_l = [1.2265, 4.6697]
shoulder_r = [-1.2595, 4.6697]
sternum = [-0.0086, 4.0739]
toe_l = [1.1192, 0.1519]
toe_r = [-1.202, 0.1519]
wrist_l = [3.2665, 2.0384]
wrist_r = [-3.2669, 2.0384]

[depth]
ankle_l = 0.6
ankle_r = -0.65
knee_l = 0.32
knee_r = -0.53
toe_l = 1.55
toe_r = 0.4

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["crown", "chin"]
pivot = "chin"

[[bones]]
name = "neck"
part = "neck"
parent = "torso_upper"
joints = ["chin", "neck_base"]
pivot = "neck_base"

[[bones]]
name = "clavicle"
part = "chest"
parent = "torso_upper"
joints = ["shoulder_r", "neck_base", "shoulder_l"]
pivot = "neck_base"

[[bones]]
name = "torso_upper"
part = "chest"
parent = "torso_lower"
joints = ["neck_base", "sternum"]
pivot = "sternum"

[[bones]]
name = "torso_lower"
part = "abdomen"
joints = ["sternum", "pelvis"]
pivot = "pelvis"

[[bones]]
name = "arm_r"
part = "rightArm"
parent = "clavicle"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "hand_r"
part = "rightHand"
parent = "arm_r"
joints = ["wrist_r", "fingertip_r"]

[[bones]]
name = "arm_l"
part = "leftArm"
parent = "clavicle"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "hand_l"
part = "leftHand"
parent = "arm_l"
joints = ["wrist_l", "fingertip_l"]

[[bones]]
name = "leg_r"
part = "rightLeg"
parent = "torso_lower"
joints = ["hip_r", "knee_r", "ankle_r", "toe_r"]

[[bones]]
name = "leg_l"
part = "leftLeg"
parent = "torso_lower"
joints = ["hip_l", "knee_l", "ankle_l", "toe_l"]

# The club and the fist holding it are not the ogre's body (held things are
# separate props): the puppet is not measured from them. Feet, each in its
# own view, like the joints.
