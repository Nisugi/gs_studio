version = 2
family = "orc"
body_type = "biped"
view = "front"
ref_ft = 6.0
axis = "crown"
joint_order = ["crown", "chin", "neck_base", "sternum", "pelvis", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "fingertip_r", "hip_r", "knee_r", "ankle_r", "toe_r", "eye_l", "shoulder_l", "elbow_l", "wrist_l", "fingertip_l", "hip_l", "knee_l", "ankle_l", "toe_l"]

[anchors]
head = "crown"
mouth = "chin"
saddle = "neck_base"

[joints]
ankle_l = [0.85, 0.45]
ankle_r = [-0.85, 0.45]
chin = [0, 5.35]
crown = [0, 5.97]
elbow_l = [1.68, 3.35]
elbow_r = [-1.68, 3.35]
eye_l = [0.12, 5.7]
eye_r = [-0.12, 5.7]
fingertip_l = [1.62, 1.85]
fingertip_r = [-1.62, 1.85]
hip_l = [0.6, 2.75]
hip_r = [-0.6, 2.75]
knee_l = [0.78, 1.25]
knee_r = [-0.78, 1.25]
neck_base = [0, 5.0]
pelvis = [0, 2.75]
shoulder_l = [0.8, 4.7]
shoulder_r = [-0.8, 4.7]
sternum = [0, 4.4]
toe_l = [1.15, 0.12]
toe_r = [-1.15, 0.12]
wrist_l = [1.75, 2.35]
wrist_r = [-1.75, 2.35]

[depth]
ankle_l = 0.43
ankle_r = -0.92
knee_l = 0.42
knee_r = -0.69
toe_r = -0.15

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["crown", "chin"]
pivot = "chin"

[[bones]]
name = "neck"
part = "neck"
parent = "torso_upper"
joints = ["chin", "neck_base"]
pivot = "neck_base"

[[bones]]
name = "clavicle"
part = "chest"
parent = "torso_upper"
joints = ["shoulder_r", "neck_base", "shoulder_l"]
pivot = "neck_base"

[[bones]]
name = "torso_upper"
part = "chest"
parent = "torso_lower"
joints = ["neck_base", "sternum"]
pivot = "sternum"

[[bones]]
name = "torso_lower"
part = "abdomen"
joints = ["sternum", "pelvis"]
pivot = "pelvis"

[[bones]]
name = "arm_r"
part = "rightArm"
parent = "clavicle"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "hand_r"
part = "rightHand"
parent = "arm_r"
joints = ["wrist_r", "fingertip_r"]

[[bones]]
name = "arm_l"
part = "leftArm"
parent = "clavicle"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "hand_l"
part = "leftHand"
parent = "arm_l"
joints = ["wrist_l", "fingertip_l"]

[[bones]]
name = "leg_r"
part = "rightLeg"
parent = "torso_lower"
joints = ["hip_r", "knee_r", "ankle_r", "toe_r"]

[[bones]]
name = "leg_l"
part = "leftLeg"
parent = "torso_lower"
joints = ["hip_l", "knee_l", "ankle_l", "toe_l"]
