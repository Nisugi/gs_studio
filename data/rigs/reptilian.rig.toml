version = 2
family = "reptilian"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_1", "tail_2", "tail_3", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.1979, 1.2096]
chest_front = [1.4793, 2.1030]
croup = [-1.6384, 1.8504]
elbow_l = [1.2293, 1.2000]
elbow_r = [1.9038, 1.2971]
eye_r = [2.24, 4.31]
forepaw_l = [1.0377, 0.7686]
forepaw_r = [2.2344, 0.6175]
groin = [-2.0676, 1.0496]
hindpaw_l = [0.0879, 0.5405]
hindpaw_r = [-1.3018, 0.4593]
hip_l = [-1.0384, 1.7004]
hip_r = [-1.4323, 1.7526]
hock_l = [-0.2707, 0.6470]
hock_r = [-1.5919, 0.6946]
mid_back = [-0.58, 2.51]
nose = [2.65, 4.05]
poll = [2.17, 4.21]
shoulder_l = [0.9797, 1.9181]
shoulder_r = [1.1022, 2.0181]
sternum = [0.9323, 1.3647]
stifle_l = [-0.4707, 0.9677]
stifle_r = [-1.3721, 1.1649]
tail_base = [-2.6323, 1.3500]
tail_1 = [-2.8996, 1.0810]
tail_2 = [-3.1507, 0.8800]
tail_3 = [-3.4668, 0.6996]
tail_tip = [-3.8247, 0.5126]
withers = [0.74, 2.78]
wrist_l = [1.0370, 0.4954]
wrist_r = [2.2193, 0.6130]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# Sprawling legs, read off reptilian-front: forelegs leave the body at +-1.2
# and reach the ground at +-3.1; hind legs (under the belly) at +-0.8..1.5.
# The guess finds no limb-width span on most of these rows (the sprawled
# limbs are wider than LIMB_SPAN_FT) and fell back to the body's edge.
[depth]
elbow_l = 1.7295
elbow_r = -1.5095
forepaw_l = 2.1997
forepaw_r = -2.6097
hindpaw_l = 1.7909
hindpaw_r = -1.7709
hip_l = 1.0737
hip_r = -1.0737
hock_l = 1.4621
hock_r = -1.4621
shoulder_l = 0.7942
shoulder_r = -0.8042
stifle_l = 1.4293
stifle_r = -1.4293
wrist_l = 2.0704
wrist_r = -2.4804

# The neck climbs diagonally, so row-sampled widths catch the back too and
# the head and neck read far too fat: pinned to the front silhouette's neck
# (about 0.9 ft wide) and head.
belly = -0.2263
chest_front = -0.0970
groin = 0.3232
sternum = -0.0646
tail_1 = 0.2586
tail_2 = -0.2263
tail_3 = 0.2586
tail_base = -0.2909
tail_tip = -0.3232
[radius_depth_ft]
neck = 0.55
skull = 0.6

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"
radius_ft = 0.5

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"
radius_ft = 0.42

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_1", "tail_2", "tail_3", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]
radius_ft = 0.13

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]
radius_ft = 0.13

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
