version = 2
family = "reptilian"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [0.1524, 1.1575]
chest_front = [2.0095, 2.356]
croup = [-1.1183, 2.1562]
elbow_l = [1.8302, 1.2574]
elbow_r = [0.2984, 1.2574]
eye_r = [3.2221, 4.4034]
forepaw_l = [1.4495, 0.3785]
forepaw_r = [-0.7729, 0.1788]
groin = [-3.3138, 1.2574]
hindpaw_l = [1.0618, 0.4085]
hindpaw_r = [-1.126, 0.2287]
hip_l = [-0.5904, 1.8067]
hip_r = [-0.9855, 1.8566]
hock_l = [-1.192, 0.5583]
hock_r = [-1.3102, 0.5083]
mid_back = [0.606, 2.6556]
nose = [3.4714, 4.1287]
poll = [2.6367, 4.3035]
shoulder_l = [2.0102, 2.2561]
shoulder_r = [1.201, 2.1562]
sternum = [0.8298, 1.557]
stifle_l = [-3.16, 1.1575]
stifle_r = [-2.5916, 1.2824]
tail_base = [0.06, 1.5071]
tail_tip = [-2.9895, 0.3386]
withers = [1.6964, 2.8553]
wrist_l = [2.1611, 0.6082]
wrist_r = [1.1712, 0.4584]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# Sprawling legs, read off reptilian-front: forelegs leave the body at +-1.2
# and reach the ground at +-3.1; hind legs (under the belly) at +-0.8..1.5.
# The guess finds no limb-width span on most of these rows (the sprawled
# limbs are wider than LIMB_SPAN_FT) and fell back to the body's edge.
[depth]
elbow_l = 2.45
elbow_r = -2.45
forepaw_l = 3.1
forepaw_r = -3.1
hindpaw_l = 1.5
hindpaw_r = -1.5
hip_l = 0.8
hip_r = -0.8
hock_l = 1.35
hock_r = -1.35
shoulder_l = 1.2
shoulder_r = -1.2
stifle_l = 1.3
stifle_r = -1.3
wrist_l = 2.7
wrist_r = -2.7

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
