version = 2
family = "reptilian"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_1", "tail_2", "tail_3", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.1160, 1.2096]
chest_front = [1.4793, 2.0707]
croup = [-1.7030, 1.9151]
elbow_l = [1.2293, 1.2000]
elbow_r = [1.9534, 1.4415]
eye_r = [2.24, 4.31]
forepaw_l = [0.9084, 0.7686]
forepaw_r = [2.2172, 0.6347]
groin = [-2.2615, 1.0496]
hindpaw_l = [0.4435, 0.8637]
hindpaw_r = [-1.1553, 0.2654]
hip_l = [-0.9738, 1.5883]
hip_r = [-1.3677, 1.6233]
hock_l = [-0.1888, 0.7763]
hock_r = [-1.6565, 0.5653]
mid_back = [-0.58, 2.51]
nose = [2.65, 4.05]
poll = [2.17, 4.21]
shoulder_l = [0.9797, 1.9181]
shoulder_r = [1.2164, 2.0009]
sternum = [0.9323, 1.3647]
stifle_l = [-0.3888, 1.0970]
stifle_r = [-1.3075, 1.0356]
tail_base = [-2.5030, 1.3500]
tail_1 = [-2.8996, 1.0982]
tail_2 = [-3.2003, 0.9296]
tail_3 = [-3.4668, 0.6996]
tail_tip = [-3.8247, 0.5126]
withers = [0.74, 2.78]
wrist_l = [0.9723, 0.4954]
wrist_r = [2.2193, 0.6604]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# Sprawling legs, read off reptilian-front: forelegs leave the body at +-1.2
# and reach the ground at +-3.1; hind legs (under the belly) at +-0.8..1.5.
# The guess finds no limb-width span on most of these rows (the sprawled
# limbs are wider than LIMB_SPAN_FT) and fell back to the body's edge.
[depth]
elbow_l = 1.3890
elbow_r = -1.1690
forepaw_l = 2.1997
forepaw_r = -2.6097
hindpaw_l = 1.5474
hindpaw_r = -1.5274
hip_l = 0.8970
hip_r = -0.8970
hock_l = 1.4298
hock_r = -1.4298
shoulder_l = 0.4537
shoulder_r = -0.4637
stifle_l = 1.5586
stifle_r = -1.5586
wrist_l = 1.8118
wrist_r = -2.2218

# The neck climbs diagonally, so row-sampled widths catch the back too and
# the head and neck read far too fat: pinned to the front silhouette's neck
# (about 0.9 ft wide) and head.
belly = -0.1940
chest_front = -0.2263
groin = 0.6637
sternum = -0.2262
tail_1 = 0.2586
tail_2 = -0.2586
tail_3 = 0.2586
tail_base = -0.4525
tail_tip = -0.3232
croup = -0.3405
[radius_depth_ft]
neck = 0.55
skull = 0.6

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"
radius_ft = 0.5

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"
radius_ft = 0.42

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_1", "tail_2", "tail_3", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]
radius_ft = 0.13

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]
radius_ft = 0.13

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
