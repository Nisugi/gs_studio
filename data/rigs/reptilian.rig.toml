version = 2
family = "reptilian"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.4, 1.15]
chest_front = [1.35, 2.2]
croup = [-1.8, 1.9]
elbow_l = [1.1, 1.2]
elbow_r = [1.7, 1.3]
eye_r = [2.2, 4.3]
forepaw_l = [1.0, 0.2]
forepaw_r = [2.5, 0.2]
groin = [-1.6, 1.0]
hindpaw_l = [-0.3, 0.2]
hindpaw_r = [-1.5, 0.2]
hip_l = [-1.2, 1.75]
hip_r = [-1.4, 1.8]
hock_l = [-0.4, 0.55]
hock_r = [-1.5, 0.6]
mid_back = [-0.6, 2.5]
nose = [2.65, 4.05]
poll = [1.95, 4.35]
shoulder_l = [0.9, 2.0]
shoulder_r = [1.1, 2.1]
sternum = [0.9, 1.3]
stifle_l = [-0.6, 1.0]
stifle_r = [-1.2, 1.1]
tail_base = [-2.6, 1.35]
tail_tip = [-3.9, 0.5]
withers = [0.7, 2.85]
wrist_l = [0.8, 0.5]
wrist_r = [2.1, 0.5]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# Sprawling legs, read off reptilian-front: forelegs leave the body at +-1.2
# and reach the ground at +-3.1; hind legs (under the belly) at +-0.8..1.5.
# The guess finds no limb-width span on most of these rows (the sprawled
# limbs are wider than LIMB_SPAN_FT) and fell back to the body's edge.
[depth]
elbow_l = 2.45
elbow_r = -2.45
forepaw_l = 3.1
forepaw_r = -3.1
hindpaw_l = 1.5
hindpaw_r = -1.5
hip_l = 0.8
hip_r = -0.8
hock_l = 1.35
hock_r = -1.35
shoulder_l = 1.2
shoulder_r = -1.2
stifle_l = 1.3
stifle_r = -1.3
wrist_l = 2.7
wrist_r = -2.7

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
