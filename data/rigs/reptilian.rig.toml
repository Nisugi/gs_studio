version = 2
family = "reptilian"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.31, 1.16]
chest_front = [1.35, 2.2]
croup = [-1.8, 1.9]
elbow_l = [1.1, 1.2]
elbow_r = [1.74, 1.31]
eye_r = [2.24, 4.31]
forepaw_l = [1.07, 0.51]
forepaw_r = [2.59, 0.68]
groin = [-1.6, 1.0]
hindpaw_l = [-0.31, 0.71]
hindpaw_r = [-1.61, 0.33]
hip_l = [-1.2, 1.75]
hip_r = [-1.4, 1.8]
hock_l = [-0.31, 0.71]
hock_r = [-1.51, 0.63]
mid_back = [-0.58, 2.51]
nose = [2.65, 4.05]
poll = [2.17, 4.21]
shoulder_l = [0.9, 2.0]
shoulder_r = [1.1, 2.1]
sternum = [0.9, 1.3]
stifle_l = [-0.33, 1.01]
stifle_r = [-1.26, 1.18]
tail_base = [-2.6, 1.35]
tail_tip = [-3.76, 0.56]
withers = [0.74, 2.78]
wrist_l = [0.94, 0.56]
wrist_r = [2.09, 0.71]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# Sprawling legs, read off reptilian-front: forelegs leave the body at +-1.2
# and reach the ground at +-3.1; hind legs (under the belly) at +-0.8..1.5.
# The guess finds no limb-width span on most of these rows (the sprawled
# limbs are wider than LIMB_SPAN_FT) and fell back to the body's edge.
[depth]
elbow_l = 2.07
elbow_r = -1.85
forepaw_l = 2.12
forepaw_r = -2.53
hindpaw_l = 1.5
hindpaw_r = -1.48
hip_l = 0.8
hip_r = -0.8
hock_l = 1.35
hock_r = -1.35
shoulder_l = 1.07
shoulder_r = -1.08
stifle_l = 1.3
stifle_r = -1.3
wrist_l = 2.12
wrist_r = -2.53

# The neck climbs diagonally, so row-sampled widths catch the back too and
# the head and neck read far too fat: pinned to the front silhouette's neck
# (about 0.9 ft wide) and head.
[radius_ft]
neck = 0.42
skull = 0.5

[radius_depth_ft]
neck = 0.55
skull = 0.6

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
