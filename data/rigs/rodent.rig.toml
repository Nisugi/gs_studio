[[bones]]
name = "ear_r"
part = "head"
parent = "skull"
joints = ["ear_base_r", "ear_tip_r"]

[[bones]]
name = "ear_l"
part = "head"
parent = "skull"
joints = ["ear_base_l", "ear_tip_l"]

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[mirror]
foreleg_r = "foreleg_l"
hindleg_l = "hindleg_r"
