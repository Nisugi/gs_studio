version = 2
family = "serpent"
body_type = "serpentine"
view = "side"
ref_ft = 1.0
axis = "diameter"
joint_order = ["snout", "skull_base", "neck_end", "chest_end", "belly_mid", "belly_end", "back_1", "back_2", "tail_mid", "tail_tip", "eye_r"]

[anchors]
head = "skull_base"
mouth = "snout"
saddle = "chest_end"

[joints]
snout = [1.6, 3.55]
skull_base = [0.3, 3.35]
eye_r = [1.25, 3.6]
neck_end = [0.6, 2.1]
chest_end = [-2.1, 2.02]
belly_mid = [-2.6, 1.4]
belly_end = [1.1, 1.36]
back_1 = [1.4, 0.55]
back_2 = [-3.2, 0.52]
tail_mid = [1.85, 0.2]
tail_tip = [3.36, 1.3]


[depth]
back_1 = 2.8
back_2 = -2.8
belly_end = 2.0
belly_mid = -2.0
chest_end = -1.1
tail_mid = -1.4

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["snout", "skull_base"]
pivot = "skull_base"
radius_ft = 0.27

[[bones]]
name = "neck"
part = "neck"
parent = "fore_body"
joints = ["skull_base", "neck_end"]
pivot = "neck_end"
radius_ft = 0.28

[[bones]]
name = "fore_body"
part = "chest"
parent = "mid_body"
joints = ["neck_end", "chest_end"]
pivot = "chest_end"

[[bones]]
name = "mid_body"
part = "abdomen"
joints = ["chest_end", "belly_mid", "belly_end"]
pivot = "belly_mid"

[[bones]]
name = "hind_body"
part = "back"
parent = "mid_body"
joints = ["belly_end", "back_1", "back_2", "tail_mid", "tail_tip"]
