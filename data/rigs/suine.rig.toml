hip_r = [-1.7137, 2.1135]
hock_l = [-2.0364, 0.5073]
hock_r = [-1.5275, 0.6638]
mid_back = [0.1127, 2.7126]
nose = [2.0159, 1.4646]
poll = [1.1922, 2.6127]
shoulder_l = [0.1286, 2.2344]
shoulder_r = [0.4598, 2.1722]
sternum = [0.8912, 1.3648]
