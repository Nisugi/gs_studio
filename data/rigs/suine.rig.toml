groin = [-1.45, 1.25]
hindpaw_l = [-2.27, 0.06]
hindpaw_r = [-1.32, 0.06]
hip_l = [-2.0, 2.15]
hip_r = [-1.82, 2.15]
hock_l = [-2.38, 0.5]
hock_r = [-1.72, 0.76]
mid_back = [-0.5, 2.75]
nose = [2.52, 1.5]
poll = [1.2, 2.65]
shoulder_l = [0.12, 2.25]
shoulder_r = [0.44, 2.25]
sternum = [0.7, 1.4]
stifle_l = [-2.05, 1.2]
stifle_r = [-1.35, 1.25]
tail_base = [-2.25, 1.98]
tail_tip = [-2.44, 1.12]
withers = [0.68, 2.78]
wrist_l = [0.02, 0.3]
wrist_r = [0.5, 0.3]

[depth]
elbow_l = 0.64
elbow_r = -0.64
eye_r = -0.3
forepaw_l = 0.76
forepaw_r = -0.76
hindpaw_l = 0.49
hindpaw_r = -0.49
hip_l = 0.3
