version = 2
family = "treekin"
body_type = "biped"
view = "front"
ref_ft = 6.0
axis = "crown"
joint_order = ["crown", "chin", "neck_base", "sternum", "pelvis", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "fingertip_r", "hip_r", "knee_r", "ankle_r", "toe_r", "eye_l", "shoulder_l", "elbow_l", "wrist_l", "fingertip_l", "hip_l", "knee_l", "ankle_l", "toe_l"]

[anchors]
head = "crown"
mouth = "chin"
saddle = "neck_base"

[joints]
ankle_l = [0.65, 0.35]
ankle_r = [-0.65, 0.35]
chin = [0.0, 5.2]
crown = [0.0, 6.0]
elbow_l = [1.2, 2.85]
elbow_r = [-1.2, 2.85]
eye_l = [0.25, 5.2]
eye_r = [-0.3, 5.2]
fingertip_l = [1.75, 1.95]
fingertip_r = [-1.75, 1.95]
hip_l = [0.45, 1.9]
hip_r = [-0.45, 1.9]
knee_l = [0.6, 1.0]
knee_r = [-0.6, 1.0]
neck_base = [0.0, 4.0]
pelvis = [0.0, 2.3]
shoulder_l = [0.75, 3.5]
shoulder_r = [-0.75, 3.5]
sternum = [0.0, 3.2]
toe_l = [1.1, 0.1]
toe_r = [-1.1, 0.1]
wrist_l = [1.55, 2.4]
wrist_r = [-1.55, 2.4]

[depth]
ankle_l = -1.05
ankle_r = 0.68
elbow_l = -0.95
elbow_r = 0.7
fingertip_l = -1.45
fingertip_r = 1.5
hip_l = -0.45
hip_r = 0.3
knee_l = -0.8
knee_r = 0.58
shoulder_l = -0.3
shoulder_r = 0.1
toe_l = -1.35
toe_r = 1.0
wrist_l = -1.25
wrist_r = 1.2

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["crown", "chin"]
pivot = "chin"

[[bones]]
name = "neck"
part = "neck"
parent = "torso_upper"
joints = ["chin", "neck_base"]
pivot = "neck_base"

[[bones]]
name = "clavicle"
part = "chest"
parent = "torso_upper"
joints = ["shoulder_r", "neck_base", "shoulder_l"]
pivot = "neck_base"

[[bones]]
name = "torso_upper"
part = "chest"
parent = "torso_lower"
joints = ["neck_base", "sternum"]
pivot = "sternum"

[[bones]]
name = "torso_lower"
part = "abdomen"
joints = ["sternum", "pelvis"]
pivot = "pelvis"

[[bones]]
name = "arm_r"
part = "rightArm"
parent = "clavicle"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "hand_r"
part = "rightHand"
parent = "arm_r"
joints = ["wrist_r", "fingertip_r"]

[[bones]]
name = "arm_l"
part = "leftArm"
parent = "clavicle"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "hand_l"
part = "leftHand"
parent = "arm_l"
joints = ["wrist_l", "fingertip_l"]

[[bones]]
name = "leg_r"
part = "rightLeg"
parent = "torso_lower"
joints = ["hip_r", "knee_r", "ankle_r", "toe_r"]

[[bones]]
name = "leg_l"
part = "leftLeg"
parent = "torso_lower"
joints = ["hip_l", "knee_l", "ankle_l", "toe_l"]
