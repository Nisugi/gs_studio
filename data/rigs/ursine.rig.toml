# Depth notes (the rig file loses comments on a re-bake; re-add them).
# No [depth] overrides: the guess puts every leg on the inner front-view
# column (+-0.54) and the hairline merge centres it on the merged
# inner+outer band (+-0.66), which is right for both pairs.
# [radius_depth_ft] on the legs: that merged band is 0.7 ft wide, which made
# every leg a flat paddle in the lying poses.

[depth]
belly = 0.1437
croup = 0.3676
elbow_l = 0.7227
elbow_r = -0.7286
forepaw_l = 0.3519
forepaw_r = -0.3928
groin = 0.1222
hip_l = 0.5508
hip_r = -0.5508
hock_l = 0.2608
hock_r = -0.2608
mid_back = 0.1424
shoulder_l = 0.5391
shoulder_r = -0.5508
sternum = 0.1435
stifle_l = 0.7110
stifle_r = -0.7227
tail_base = -0.1628
tail_1 = -0.1584
tail_2 = -0.2252
tail_3 = 0.0060
tail_tip = 0.0623
withers = 0.1017
wrist_l = 0.4356
wrist_r = -0.4444

chest_front = 0.0205
[radius_depth_ft]
foreleg_l = 0.28
foreleg_r = 0.28
hindleg_l = 0.28
hindleg_r = 0.28
tail = 0.176

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_1", "tail_2", "tail_3", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
