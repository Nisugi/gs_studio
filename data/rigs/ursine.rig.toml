version = 2
family = "ursine"
body_type = "quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.3764, 1.3154]
chest_front = [0.4372, 1.7146]
croup = [-1.1117, 2.513]
elbow_l = [0.6698, 1.1657]
elbow_r = [0.1158, 1.2156]
eye_r = [2.1344, 2.3134]
forepaw_l = [0.4931, 0.0878]
forepaw_r = [0.2687, 0.018]
groin = [-0.925, 1.3653]
hindpaw_l = [-1.6236, 0.0878]
hindpaw_r = [-0.8252, 0.0878]
hip_l = [-1.5742, 1.9641]
hip_r = [-1.2149, 1.9641]
hock_l = [-1.7171, 0.4671]
hock_r = [-1.0525, 0.4671]
mid_back = [-0.1416, 2.6627]
nose = [1.5875, 1.9641]
poll = [1.6892, 2.5629]
shoulder_l = [0.3243, 2.014]
shoulder_r = [-0.0652, 1.9641]
sternum = [0.4497, 1.2655]
stifle_l = [-1.5247, 1.0659]
stifle_r = [-0.9994, 1.1657]
tail_base = [-1.8709, 2.0639]
tail_tip = [-2.0702, 1.8643]
withers = [1.115, 2.7126]
wrist_l = [0.3704, 0.3174]
wrist_r = [0.3779, 0.3673]

# Depth notes (the rig file loses comments on a re-bake; re-add them).
# No [depth] overrides: the guess puts every leg on the inner front-view
# column (+-0.54) and the hairline merge centres it on the merged
# inner+outer band (+-0.66), which is right for both pairs.
# [radius_depth_ft] on the legs: that merged band is 0.7 ft wide, which made
# every leg a flat paddle in the lying poses.
[radius_depth_ft]
foreleg_l = 0.28
foreleg_r = 0.28
hindleg_l = 0.28
hindleg_r = 0.28

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]
