hip_r = [-1.2758, 1.8318]
hock_l = [-1.7171, 0.6003]
hock_r = [-0.9711, 0.6101]
mid_back = [-0.1416, 2.6627]
nose = [1.5875, 1.9641]
poll = [1.6892, 2.5629]
shoulder_l = [0.3465, 1.9306]
