version = 2
family = "winged_beast"
body_type = "winged_quadruped"
view = "side"
ref_ft = 3.0
axis = "withers"
joint_order = ["nose", "poll", "withers", "mid_back", "croup", "tail_base", "tail_tip", "chest_front", "sternum", "belly", "groin", "eye_r", "shoulder_r", "elbow_r", "wrist_r", "forepaw_r", "hip_r", "stifle_r", "hock_r", "hindpaw_r", "wing_root_r", "wing_elbow_r", "wing_wrist_r", "wing_tip_r", "shoulder_l", "elbow_l", "wrist_l", "forepaw_l", "hip_l", "stifle_l", "hock_l", "hindpaw_l", "wing_root_l", "wing_elbow_l", "wing_wrist_l", "wing_tip_l"]

[anchors]
head = "poll"
mouth = "nose"
saddle = "mid_back"

[joints]
belly = [-0.1, 1.0]
chest_front = [1.0, 1.55]
croup = [-0.75, 1.7]
elbow_l = [0.55, 1.0]
elbow_r = [0.8, 1.0]
eye_r = [1.2, 2.3]
forepaw_l = [0.7, 0.1]
forepaw_r = [1.05, 0.1]
groin = [-0.7, 1.05]
hindpaw_l = [-1.0, 0.1]
hindpaw_r = [-0.65, 0.1]
hip_l = [-0.75, 1.45]
hip_r = [-0.6, 1.5]
hock_l = [-1.05, 0.5]
hock_r = [-0.8, 0.5]
mid_back = [-0.2, 1.85]
nose = [1.45, 2.2]
poll = [1.05, 2.45]
shoulder_l = [0.55, 1.5]
shoulder_r = [0.75, 1.55]
sternum = [0.6, 1.05]
stifle_l = [-0.95, 0.9]
stifle_r = [-0.55, 0.95]
tail_base = [-1.05, 1.5]
tail_tip = [-1.75, 0.55]
wing_elbow_l = [-0.05, 2.55]
wing_elbow_r = [-0.05, 2.55]
wing_root_l = [0.15, 1.7]
wing_root_r = [0.15, 1.7]
wing_tip_l = [-1.0, 2.95]
wing_tip_r = [-1.0, 2.95]
wing_wrist_l = [-0.55, 2.85]
wing_wrist_r = [-0.55, 2.85]
withers = [0.4, 1.95]
wrist_l = [0.55, 0.45]
wrist_r = [0.85, 0.45]

[depth]
elbow_l = 0.35
elbow_r = -0.35
forepaw_l = 0.35
forepaw_r = -0.35
hindpaw_l = 0.3
hindpaw_r = -0.3
hip_l = 0.3
hip_r = -0.3
hock_l = 0.3
hock_r = -0.3
shoulder_l = 0.35
shoulder_r = -0.35
stifle_l = 0.3
stifle_r = -0.3
wing_elbow_l = 0.7
wing_elbow_r = -0.7
wing_root_l = 0.2
wing_root_r = -0.2
wing_tip_l = 1.3
wing_tip_r = -1.3
wing_wrist_l = 1.05
wing_wrist_r = -1.05
wrist_l = 0.35
wrist_r = -0.35

[mirror]
foreleg_l = "foreleg_r"
hindleg_l = "hindleg_r"
wing_l = "wing_r"

[radius_depth_ft]
wing_r = 0.12
wing_l = 0.12
wing_hand_r = 0.12
wing_hand_l = 0.12

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["nose", "poll"]
pivot = "poll"

[[bones]]
name = "neck"
part = "neck"
parent = "spine"
joints = ["poll", "withers"]
pivot = "withers"

[[bones]]
name = "spine"
part = "back"
joints = ["withers", "mid_back", "croup", "tail_base"]

[[bones]]
name = "tail"
part = "back"
parent = "spine"
joints = ["tail_base", "tail_tip"]

[[bones]]
name = "brisket"
part = "chest"
parent = "spine"
joints = ["chest_front", "sternum"]
pivot = "sternum"

[[bones]]
name = "underline"
part = "abdomen"
parent = "spine"
joints = ["sternum", "belly", "groin"]

[[bones]]
name = "foreleg_r"
part = "rightArm"
parent = "spine"
joints = ["shoulder_r", "elbow_r", "wrist_r"]

[[bones]]
name = "foreleg_l"
part = "leftArm"
parent = "spine"
joints = ["shoulder_l", "elbow_l", "wrist_l"]

[[bones]]
name = "forepaw_r"
part = "rightHand"
parent = "foreleg_r"
joints = ["wrist_r", "forepaw_r"]

[[bones]]
name = "forepaw_l"
part = "leftHand"
parent = "foreleg_l"
joints = ["wrist_l", "forepaw_l"]

[[bones]]
name = "hindleg_r"
part = "rightLeg"
parent = "spine"
joints = ["hip_r", "stifle_r", "hock_r", "hindpaw_r"]

[[bones]]
name = "hindleg_l"
part = "leftLeg"
parent = "spine"
joints = ["hip_l", "stifle_l", "hock_l", "hindpaw_l"]

[[bones]]
name = "wing_r"
part = "back"
parent = "spine"
joints = ["wing_root_r", "wing_elbow_r", "wing_wrist_r"]

[[bones]]
name = "wing_l"
part = "back"
parent = "spine"
joints = ["wing_root_l", "wing_elbow_l", "wing_wrist_l"]

[[bones]]
name = "wing_hand_r"
part = "back"
parent = "wing_r"
joints = ["wing_wrist_r", "wing_tip_r"]

[[bones]]
name = "wing_hand_l"
part = "back"
parent = "wing_l"
joints = ["wing_wrist_l", "wing_tip_l"]
