version = 2
family = "worm"
body_type = "serpentine"
view = "side"
ref_ft = 2.0
axis = "diameter"
joint_order = ["snout", "skull_base", "neck_end", "chest_end", "belly_mid", "belly_end", "back_1", "back_2", "tail_mid", "tail_tip", "eye_r"]
# The worm art has no eye.
unused = ["eye_r"]

[anchors]
head = "skull_base"
mouth = "snout"
saddle = "chest_end"

[joints]
snout = [4.8653, 6.9422]
skull_base = [3.78, 6.8423]
neck_end = [2.839, 5.1445]
chest_end = [3.3496, 2.9472]
belly_mid = [3.3077, 1.2494]
belly_end = [1.8404, 0.9498]
back_1 = [-0.0117, 0.8999]
back_2 = [-1.8023, 0.8999]
tail_mid = [-3.7219, 0.8]
tail_tip = [-4.9423, 0.5004]

[depth]
back_1 = -1.2
back_2 = -1.2
tail_mid = 1.6
tail_tip = 3.2

[[bones]]
name = "skull"
part = "head"
parent = "neck"
joints = ["snout", "skull_base"]
pivot = "skull_base"

[[bones]]
name = "neck"
part = "neck"
parent = "fore_body"
joints = ["skull_base", "neck_end"]
pivot = "neck_end"

[[bones]]
name = "fore_body"
part = "chest"
parent = "mid_body"
joints = ["neck_end", "chest_end"]
pivot = "chest_end"

[[bones]]
name = "mid_body"
part = "abdomen"
joints = ["chest_end", "belly_mid", "belly_end"]
pivot = "belly_mid"

[[bones]]
name = "hind_body"
part = "back"
parent = "mid_body"
joints = ["belly_end", "back_1", "back_2", "tail_mid", "tail_tip"]
